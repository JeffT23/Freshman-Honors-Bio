<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Honors Biology — 3D Models</title>
<style>
:root{
  --glass:#F2EFF7; --glass-2:#E7E2F0; --track:#D9D2E6;
  --page-ink:#241B3D; --page-mute:#5E5678; --page-faint:#8A82A0;
  --eosin:#E0417B; --eosin-ink:#B82A5D; --cyto:#2FB8A0; --amber:#F0A73A;
  --panel:#1C1530; --panel-2:#241B3D; --hema:#6B4BA8; --hema-dim:#3A2B5C;
  --ink:#EFE9F7; --ink-mute:#A79DBD; --ink-faint:#6F6689;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:radial-gradient(1200px 700px at 50% -12%,#fff 0%,transparent 62%),
             linear-gradient(180deg,var(--glass),var(--glass-2));
  color:var(--page-ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none}

/* ---- top bar ---- */
#bar{
  position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;
  padding:12px 16px;background:linear-gradient(180deg,rgba(242,239,247,.96),rgba(242,239,247,0));
  z-index:10;flex-wrap:wrap;
}
#bar h1{font-family:var(--display);font-size:17px;margin:0;font-weight:600;flex:0 0 auto}
#picker{
  font:inherit;font-size:13px;padding:7px 11px;border-radius:7px;
  border:1px solid var(--track);background:#fff;color:var(--page-ink);cursor:pointer;
}
.btn{
  font:inherit;font-size:12.5px;font-weight:600;border:0;border-radius:7px;padding:7px 13px;
  background:var(--eosin);color:#fff;cursor:pointer;
}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--page-mute);border:1px solid var(--track)}
.btn:active{transform:translateY(1px)}
.spacer{flex:1 1 auto}
#lvl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--page-faint);text-transform:uppercase}

/* ---- info panel ---- */
#info{
  position:fixed;right:16px;bottom:16px;width:min(330px,calc(100vw - 32px));
  background:linear-gradient(165deg,var(--panel-2),var(--panel));
  border:1px solid var(--hema-dim);border-radius:10px;padding:16px;color:var(--ink);
  box-shadow:0 8px 28px rgba(36,27,61,.3);z-index:10;
  transform:translateY(8px);opacity:0;pointer-events:none;transition:.22s ease;
}
#info.on{transform:none;opacity:1;pointer-events:auto}
#info .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--eosin)}
#info h2{font-family:var(--display);font-size:18px;margin:7px 0 8px;font-weight:600}
#info p{font-size:14px;line-height:1.55;margin:0;color:var(--ink-mute)}
#info .x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--ink-faint);font-size:17px;line-height:1}

/* ---- hint ---- */
#hint{
  position:fixed;left:16px;bottom:16px;z-index:10;max-width:min(300px,calc(100vw - 32px));
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--page-faint);line-height:1.7;
}
#load{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--page-faint);background:var(--glass);z-index:20;
}
@media (max-width:560px){
  #bar h1{font-size:15px;width:100%}
  #info{left:16px;right:16px;width:auto;bottom:52px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <h1>Biology in 3D</h1>
  <select id="picker"></select>
  <button class="btn ghost" id="reset">Recenter</button>
  <span class="spacer"></span>
  <span id="lvl"></span>
</div>
<div id="info"><span class="x" id="infoX">&times;</span><div class="eyebrow" id="infoTag"></div><h2 id="infoTitle"></h2><p id="infoBody"></p></div>
<div id="hint">Drag to rotate &middot; scroll or pinch to zoom &middot; click a labeled part</div>
<div id="load">Loading</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   HONORS BIOLOGY — 3D MODEL HARNESS
   Three.js r128 (UMD, pinned). No OrbitControls in r128, so a
   minimal orbit controller is implemented below for mouse+touch.
   Avoid CapsuleGeometry (r142+). Use Cylinder/Sphere.

   TO ADD A MODEL: push one object into MODELS. Required shape:
     { id, name, level, hint, build(ctx) }
   build() receives { group, add, THREE } and should populate
   `group`. Use add(mesh, {tag,title,body}) to make a mesh
   clickable with an info-panel entry.
   ============================================================ */

var W, H, renderer, scene, camera, raycaster, pointer, root, current;
var PICKABLE = [];

function boot(){
  var stage = document.getElementById('stage');
  W = window.innerWidth; H = window.innerHeight;

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  stage.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 2000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  var key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(6,9,7); scene.add(key);
  var rim = new THREE.DirectionalLight(0xB98BFF, 0.35); rim.position.set(-7,-3,-6); scene.add(rim);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  root = new THREE.Group(); scene.add(root);

  initOrbit(renderer.domElement);
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onClick);
  document.getElementById('infoX').onclick = hideInfo;
  document.getElementById('reset').onclick = function(){ orbit.reset(); };

  buildPicker();
  load(0);
  document.getElementById('load').style.display='none';
  animate();
}
function onResize(){
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
}

/* ---------------- minimal orbit controller ---------------- */
var orbit = {
  theta:0.6, phi:1.15, radius:16, target:new THREE.Vector3(0,0,0),
  base:{theta:0.6, phi:1.15, radius:16},
  apply:function(){
    var p=Math.max(0.15, Math.min(Math.PI-0.15, this.phi));
    camera.position.set(
      this.target.x + this.radius*Math.sin(p)*Math.sin(this.theta),
      this.target.y + this.radius*Math.cos(p),
      this.target.z + this.radius*Math.sin(p)*Math.cos(this.theta)
    );
    camera.lookAt(this.target);
  },
  reset:function(){
    this.theta=this.base.theta; this.phi=this.base.phi; this.radius=this.base.radius;
    this.target.set(0,0,0); this.apply();
    if(current && current.onReset) current.onReset();
  },
  frame:function(r){ this.base.radius=r; this.radius=r; this.target.set(0,0,0); this.apply(); }
};
function initOrbit(el){
  var down=false, lx=0, ly=0, pinch=0, moved=0;
  function start(x,y){ down=true; lx=x; ly=y; moved=0; }
  function move(x,y){
    if(!down) return;
    var dx=x-lx, dy=y-ly; lx=x; ly=y; moved+=Math.abs(dx)+Math.abs(dy);
    orbit.theta -= dx*0.008;
    orbit.phi   -= dy*0.008;
    orbit.apply();
  }
  function end(){ down=false; }
  el.addEventListener('mousedown',function(e){ start(e.clientX,e.clientY); });
  window.addEventListener('mousemove',function(e){ move(e.clientX,e.clientY); });
  window.addEventListener('mouseup',end);
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    orbit.radius = Math.max(3, Math.min(120, orbit.radius + (e.deltaY>0?1:-1)*orbit.radius*0.09));
    orbit.apply();
  },{passive:false});
  el.addEventListener('touchstart',function(e){
    if(e.touches.length===1) start(e.touches[0].clientX,e.touches[0].clientY);
    else if(e.touches.length===2) pinch=dist(e.touches);
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(e.touches.length===1) move(e.touches[0].clientX,e.touches[0].clientY);
    else if(e.touches.length===2){
      var d=dist(e.touches);
      if(pinch){ orbit.radius=Math.max(3,Math.min(120,orbit.radius*(pinch/d))); orbit.apply(); }
      pinch=d;
    }
    e.preventDefault();
  },{passive:false});
  el.addEventListener('touchend',function(){ end(); pinch=0; },{passive:true});
  function dist(t){ var a=t[0], b=t[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  orbit.apply();
}

/* ---------------- picking + info panel ---------------- */
function infoOf(o){ while(o && !o.userData.info) o = o.parent; return o ? o.userData.info : null; }
/* world-space extent of the registered structure a mesh belongs to, cached on first use */
function shellSize(o){
  while(o && !o.userData.info) o = o.parent;
  if(!o) return Infinity;
  if(o.userData.shellSize===undefined) o.userData.shellSize = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).length();
  return o.userData.shellSize;
}
/* what a click at screen (cx,cy) selects: returns the structure's info, or null */
function pickAt(cx, cy){
  pointer.x = (cx / W) * 2 - 1;
  pointer.y = -(cy / H) * 2 + 1;
  camera.updateMatrixWorld(); /* a click right after Recenter or a zoom must use the camera's new pose */
  raycaster.setFromCamera(pointer, camera);
  var hits = raycaster.intersectObjects(PICKABLE, true);
  /* the raycaster ignores .visible, so drop anything hidden or inside a hidden group */
  hits = hits.filter(function(h){ var o=h.object; while(o){ if(o.visible===false) return false; o=o.parent; } return true; });
  /* translucent shells flagged passThrough yield to whatever is behind them */
  var hit = null;
  for(var i=0;i<hits.length;i++){ if(!hits[i].object.userData.passThrough){ hit=hits[i]; break; } }
  /* only shells were crossed: choose the innermost one (rim -> outer wall, interior -> membrane) */
  if(!hit){ var best=Infinity; for(var j=0;j<hits.length;j++){ var s=shellSize(hits[j].object); if(s<best){ best=s; hit=hits[j]; } } }
  return hit ? infoOf(hit.object) : null;
}
function onClick(e){
  var info = pickAt(e.clientX, e.clientY);
  if(current && current.onPick && current.onPick(info)===false) return;
  if(info) showInfo(info); else hideInfo();
}
function showInfo(i){
  document.getElementById('infoTag').textContent = i.tag || '';
  document.getElementById('infoTitle').textContent = i.title || '';
  document.getElementById('infoBody').textContent = i.body || '';
  document.getElementById('info').classList.add('on');
}
function hideInfo(){ document.getElementById('info').classList.remove('on'); }

/* ---------------- model loading ---------------- */
function clearRoot(){
  PICKABLE.length = 0;
  while(root.children.length){
    var c = root.children[0];
    root.remove(c);
    c.traverse(function(o){
      if(o.geometry) o.geometry.dispose();
      if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){ if(m.map) m.map.dispose(); m.dispose(); }); }
    });
  }
}
function load(i){
  clearRoot(); hideInfo();
  current = MODELS[i];
  document.querySelectorAll('#bar [data-model-ui]').forEach(function(el){
    el.style.display = (el.getAttribute('data-model-ui')===current.id) ? '' : 'none';
  });
  var group = new THREE.Group(); root.add(group);
  function add(mesh, info){
    if(info){ mesh.userData.info = info; PICKABLE.push(mesh); }
    group.add(mesh); return mesh;
  }
  current.build({group:group, add:add, THREE:THREE});
  document.getElementById('lvl').textContent = current.level || '';
  document.getElementById('hint').textContent = current.hint || 'Drag to rotate · scroll to zoom · click a labeled part';
  orbit.frame(current.radius || 16);
}
function buildPicker(){
  var p = document.getElementById('picker');
  MODELS.forEach(function(m,i){
    var o=document.createElement('option'); o.value=i; o.textContent=m.name; p.appendChild(o);
  });
  p.onchange = function(){ load(parseInt(this.value,10)); };
}
function animate(){
  requestAnimationFrame(animate);
  if(current && current.tick) current.tick(performance.now()*0.001);
  renderer.render(scene, camera);
}

/* ---------------- shared helpers ---------------- */
function mat(hex, opts){
  opts = opts || {};
  return new THREE.MeshStandardMaterial({
    color:hex, roughness:opts.rough!==undefined?opts.rough:0.55,
    metalness:opts.metal||0.05,
    transparent:opts.opacity!==undefined, opacity:opts.opacity!==undefined?opts.opacity:1,
    side:opts.side||THREE.FrontSide, flatShading:!!opts.flat
  });
}
function ball(r, hex, seg, opts){ return new THREE.Mesh(new THREE.SphereGeometry(r, seg||24, seg||24), mat(hex,opts)); }
function rod(r, len, hex, opts){ return new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat(hex,opts)); }
/* r128 has no CapsuleGeometry — compose one */
function capsule(r, len, hex, opts){
  var g = new THREE.Group();
  var m = mat(hex, opts);
  var body = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20), m);
  var a = new THREE.Mesh(new THREE.SphereGeometry(r,20,16), m); a.position.y =  len/2;
  var b = new THREE.Mesh(new THREE.SphereGeometry(r,20,16), m); b.position.y = -len/2;
  g.add(body,a,b); return g;
}
/* a rod stretched and rotated to run between two arbitrary points */
function segment(p1, p2, r, hex){
  var dir = new THREE.Vector3().subVectors(p2, p1);
  var len = Math.max(dir.length(), 0.001);
  var m = rod(r, len, hex);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  return m;
}

/* ============================================================
   TEACHING KIT — shared by the models. A registry of clickable
   structures, a pulsing highlight, camera focus, a narrated Tour and
   a click-the-structure Quiz, with Tour/Quiz buttons in #bar.

   In build():   var K = teachKit(this, {id, radius, stops, quiz, onTourEnd});
                 K.register(key, obj, info, passThrough) for every structure
   In tick():    var f = K.tick(t);   // f.dt, f.at (clock frozen during a quiz), f.paused
   The model's onPick / onReset delegate to K.onPick / K.onReset.
   Stops: {tag, title, body, focus:key|null, r, keys:[...], enter()}
   Quiz items: {q, keys:[...], ok, hint, when()}
   ============================================================ */
function teachKit(self, cfg){
  var K = {
    reg:{}, glow:[], focusObj:null, focusPt:null, focusR:null, sel:null,
    stop:-1, quiz:null, animT:0, lastT:undefined, tmp:new THREE.Vector3(), stopPanel:null,
    stops:cfg.stops||[], quizItems:cfg.quiz||[]
  };
  K.register = function(key, obj, info, passThrough){
    info.key=key; obj.userData.info=info;
    obj.traverse(function(o){ if(o.isMesh){ PICKABLE.push(o); if(passThrough) o.userData.passThrough=true; } });
    (K.reg[key]=K.reg[key]||[]).push(obj);
    return obj;
  };
  K.highlight = function(keys){
    K.glow.forEach(function(m){ m.material.emissive.setHex(0x000000); m.material.emissiveIntensity=1; });
    K.glow=[];
    keys.forEach(function(k){ (K.reg[k]||[]).forEach(function(obj){ obj.traverse(function(o){
      if(o.isMesh && o.material && o.material.emissive){ o.material.emissive.setHex(0xFFE2EE); K.glow.push(o); }
    }); }); });
  };
  K.focusKey = function(key, r){ K.focusObj=(K.reg[key]||[null])[0]; K.focusPt=null; if(r!==undefined) K.focusR=r; };
  K.focusHome = function(r){ K.focusObj=null; K.focusPt=new THREE.Vector3(0,0,0); K.focusR=(r!==undefined?r:cfg.radius); };

  /* ---------- tour ---------- */
  K.applyStop = function(i){
    K.stop=i; K.sel=null;
    if(i<0){
      K.highlight([]); K.focusHome(cfg.radius); K.stopPanel=null; hideInfo();
      K.tourBtn.textContent='Tour ▶';
      if(cfg.onTourEnd) cfg.onTourEnd();
      return;
    }
    var st=K.stops[i];
    if(st.enter) st.enter();
    K.highlight(st.keys||(st.focus?[st.focus]:[]));
    if(st.focus) K.focusKey(st.focus, st.r); else K.focusHome(st.r);
    K.stopPanel={tag:'Tour '+(i+1)+'/'+K.stops.length+' · '+st.tag, title:st.title, body:st.body};
    showInfo(K.stopPanel);
    K.tourBtn.textContent='Tour '+(i+1)+'/'+K.stops.length+' ▶';
  };

  /* ---------- quiz ---------- */
  K.startQuiz = function(){
    var items=K.quizItems.filter(function(it){ return !it.when || it.when(); });
    for(var k=items.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var tmp=items[k]; items[k]=items[j]; items[j]=tmp; }
    items=items.slice(0,10);
    K.quiz={items:items, idx:0, score:0, answered:false, nextAt:null};
    K.focusObj=null; K.focusPt=null; K.sel=null; K.highlight([]);
    K.showPrompt();
  };
  K.showPrompt = function(){
    var qz=K.quiz, it=qz.items[qz.idx];
    qz.answered=false; qz.nextAt=null; K.highlight([]);
    if(it.enter) it.enter();
    showInfo({tag:'Quiz '+(qz.idx+1)+'/'+qz.items.length+' · score '+qz.score, title:it.q,
      body:'Click the structure in the 3D scene. Drag to rotate if you need a better view.'});
    K.quizBtn.textContent='Skip ▶ ('+(qz.idx+1)+'/'+qz.items.length+')';
  };
  K.endQuiz = function(){
    var qz=K.quiz, n=qz.items.length, sc=qz.score;
    var msg = sc===n ? 'Perfect. You can find everything this level tests.'
            : sc>=n*0.7 ? 'Solid. Take the Tour for the ones you missed, then try again.'
            : 'Take the Tour — it walks through every one of these — then quiz again.';
    showInfo({tag:'Quiz complete', title:sc+' / '+n+' correct', body:msg});
    K.quiz=null; K.quizBtn.textContent='Quiz me'; K.highlight([]);
  };
  K.quizNext = function(){ var qz=K.quiz; qz.idx++; if(qz.idx>=qz.items.length) K.endQuiz(); else K.showPrompt(); };

  /* ---------- picking ---------- */
  K.onPick = function(info){
    if(K.quiz){
      var qz=K.quiz, it=qz.items[qz.idx];
      if(!info || qz.answered) return false;
      if(it.keys.indexOf(info.key)>=0){
        qz.score++; qz.answered=true; qz.nextAt=performance.now()*0.001+3.2;
        K.highlight([info.key]);
        showInfo({tag:'Correct · '+(qz.idx+1)+'/'+qz.items.length+' · score '+qz.score, title:info.title, body:it.ok});
      } else {
        showInfo({tag:'Not quite · '+(qz.idx+1)+'/'+qz.items.length, title:'That is the '+info.title.toLowerCase(), body:it.hint+' Try again.'});
      }
      return false;
    }
    if(info){ K.sel=info.key; K.highlight([info.key]); K.focusKey(info.key); return true; }
    /* an empty click during a tour stop brings the narrative back instead of hiding the panel */
    if(K.stop>=0 && K.stopPanel){ K.sel=null; K.highlight(K.stops[K.stop].keys||[]); showInfo(K.stopPanel); return false; }
    K.sel=null; K.highlight([]); K.focusObj=null;
    return true;
  };
  K.onReset = function(){ K.sel=null; K.focusObj=null; K.focusPt=null; K.focusR=null; K.highlight([]); };

  /* ---------- per-frame: camera focus, glow pulse, quiz auto-advance ---------- */
  K.tick = function(t){
    var dt = K.lastT===undefined ? 0 : Math.min(0.05, t-K.lastT); K.lastT=t;
    if(!K.quiz) K.animT += dt;
    var k=1-Math.exp(-dt*9), dest=null;
    if(K.focusObj) dest=K.focusObj.getWorldPosition(K.tmp); else if(K.focusPt) dest=K.focusPt;
    if(dest) orbit.target.lerp(dest, k);
    if(K.focusR!==null && K.focusR!==undefined){
      orbit.radius += (K.focusR-orbit.radius)*k;
      if(Math.abs(K.focusR-orbit.radius)<0.05){ orbit.radius=K.focusR; K.focusR=null; }
      orbit.apply();
    } else if(dest) orbit.apply();
    var glow=0.22+0.16*Math.sin(t*5);
    for(var i=0;i<K.glow.length;i++) K.glow[i].material.emissiveIntensity=glow;
    if(K.quiz && K.quiz.nextAt!==null && t>=K.quiz.nextAt) K.quizNext();
    if(K.labels.length) K.updateLabels();
    return {dt:dt, at:K.animT, paused:!!(K.focusObj||K.sel||K.quiz)};
  };

  /* ---------- bar buttons, created once and shown only while this model is active ---------- */
  K.button = function(id, cls, text){
    var b=document.getElementById(id);
    if(!b){ b=document.createElement('button'); b.id=id; b.className=cls; document.getElementById('bar').insertBefore(b, document.getElementById('lvl')); }
    b.setAttribute('data-model-ui', cfg.id); b.textContent=text; return b;
  };
  K.tourBtn=K.button(cfg.id+'Tour','btn','Tour ▶');
  K.tourBtn.onclick=function(){
    if(K.quiz){ K.quiz=null; K.quizBtn.textContent='Quiz me'; }
    var n=K.stop+1; if(n>=K.stops.length) n=-1;
    K.applyStop(n);
  };
  K.quizBtn=K.button(cfg.id+'Quiz','btn ghost','Quiz me');
  K.quizBtn.onclick=function(){
    if(K.quiz){ K.quizNext(); return; }
    if(K.stop>=0){ K.stop=-1; K.tourBtn.textContent='Tour ▶'; K.stopPanel=null; if(cfg.onTourEnd) cfg.onTourEnd(); }
    K.focusPt=null; K.focusObj=null;
    K.startQuiz();
  };

  /* ---------- floating labels: canvas-text sprites at constant screen size, with a toggle ----------
     Needs cfg.group (the model's group). K.label(obj, text, dy) pins a label dy units above obj. */
  K.labels=[]; K.labelsOn = cfg.labels!==false;
  if(cfg.group){ K.labelGroup=new THREE.Group(); cfg.group.add(K.labelGroup); }
  function drawLabel(c, text){
    var x=c.getContext('2d'), font='600 26px "Segoe UI",system-ui,sans-serif';
    x.font=font; var w=Math.ceil(x.measureText(text).width)+30, h=46; c.width=w; c.height=h;
    x.font=font; x.fillStyle='rgba(28,21,48,0.84)';
    x.beginPath(); x.moveTo(12,0); x.lineTo(w-12,0); x.arc(w-12,12,12,-Math.PI/2,0); x.lineTo(w,h-12); x.arc(w-12,h-12,12,0,Math.PI/2);
    x.lineTo(12,h); x.arc(12,h-12,12,Math.PI/2,Math.PI); x.lineTo(0,12); x.arc(12,12,12,Math.PI,Math.PI*1.5); x.closePath(); x.fill();
    x.fillStyle='#EFE9F7'; x.textBaseline='middle'; x.fillText(text,15,h/2+1);
    return {w:w, h:h};
  }
  K.label = function(obj, text, dy){
    if(!K.labelGroup) return null;
    var c=document.createElement('canvas'), d=drawLabel(c,text);
    var tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, sizeAttenuation:false}));
    sp.scale.set(0.032*d.w/d.h, 0.032, 1); sp.renderOrder=10;
    sp.userData.target=obj; sp.userData.dy=(dy===undefined?0.6:dy); sp.userData.canvas=c;
    K.labelGroup.add(sp); K.labels.push(sp); return sp;
  };
  /* redraw a label's text in place (live readouts) */
  K.relabel = function(sp, text){
    if(!sp) return;
    var d=drawLabel(sp.userData.canvas, text);
    sp.material.map.needsUpdate=true; sp.scale.set(0.032*d.w/d.h, 0.032, 1);
  };
  K.updateLabels = function(){
    for(var i=0;i<K.labels.length;i++){
      var sp=K.labels[i], o=sp.userData.target, shown=K.labelsOn;
      for(var p=o; p && shown; p=p.parent) if(p.visible===false) shown=false;
      sp.visible=shown; if(!shown) continue;
      o.getWorldPosition(sp.position); sp.position.y+=sp.userData.dy;
    }
  };
  if(cfg.labels!==undefined){
    K.labelsBtn=K.button(cfg.id+'Labels','btn ghost', K.labelsOn?'Labels: on':'Labels: off');
    K.labelsBtn.onclick=function(){ K.labelsOn=!K.labelsOn; K.labelsBtn.textContent=K.labelsOn?'Labels: on':'Labels: off'; };
  }
  self._K=K;
  return K;
}

      'ribosome':{tag:'Both cell types', title:'Ribosome',

      'ribosome-er':{tag:'Both cell types', title:'Ribosome (bound to rough ER)',

      'flagellum':{tag:'Prokaryote', title:'Flagellum',

      'pili':{tag:'Prokaryote', title:'Pili',

      'virus':{tag:'Not a cell', title:'Bacteriophage (virus)',

      'biofilm':{tag:'Prokaryote', title:'Biofilm',

      'biofilm-cell':{tag:'Prokaryote', title:'Bacterium in a biofilm',

      'membrane-euk':{tag:'Eukaryote', title:'Plasma membrane',

  tick:function(t){
    var self=this, P=self._parts; if(!P) return;
    var f=self._K.tick(t), at=f.at;

    /* the animal cell turns slowly unless something is being looked at */
    if(!f.paused) self._ang += f.dt*0.055;
    P.euk.rotation.y=self._ang;
    P.pro.rotation.y=Math.sin(t*0.16)*0.22;
    P.flag.rotation.x=t*10;
    P.phage.position.y=2.62+Math.sin(t*2)*0.04;

    /* secretory vesicle: ER -> Golgi (modified) -> membrane (fuses) */
    var ph=(at%7)/7, v=P.vesicle;
    if(ph<0.38){ v.position.lerpVectors(P.vP0,P.vP1,ph/0.38); v.scale.setScalar(1); v.material.color.setHex(0xE87FB0); }
    else if(ph<0.5){ v.position.copy(P.vP1); v.material.color.setHex(0xF0A73A); }
    else if(ph<0.88){ v.position.lerpVectors(P.vP1,P.vP2,(ph-0.5)/0.38); }
    else if(ph<0.97){ v.position.copy(P.vP2); v.scale.setScalar(Math.max(0.01,1-(ph-0.88)/0.09)); }
    else { v.position.copy(P.vP0); v.scale.setScalar(Math.max(0.01,(ph-0.97)/0.03)); v.material.color.setHex(0xE87FB0); }

    /* phagocytosis: approach, engulf, lysosome fuses, bacterium digested, reset */
    var pp=(at%9)/9, b=P.phBac, ves=P.phVes, ly=P.lyso;
    if(pp<0.3){ b.position.lerpVectors(P.phA,P.phB,pp/0.3); b.scale.setScalar(1); ves.visible=false; ly.position.copy(P.lysoHome); }
    else if(pp<0.5){ var u=(pp-0.3)/0.2; b.position.lerpVectors(P.phB,P.phC,u); ves.visible=true; ves.position.copy(b.position); ves.scale.setScalar(0.3+0.7*u); ly.position.copy(P.lysoHome); }
    else if(pp<0.72){ ly.position.lerpVectors(P.lysoHome,P.phC,(pp-0.5)/0.22); b.position.copy(P.phC); ves.position.copy(P.phC); ves.scale.setScalar(1); }
    else if(pp<0.88){ var d=(pp-0.72)/0.16; ly.position.copy(P.phC); b.scale.setScalar(Math.max(0.05,1-d)); ves.scale.setScalar(1-0.5*d); }
    else { var w=(pp-0.88)/0.12; ly.position.lerpVectors(P.phC,P.lysoHome,w); ves.visible=false; b.position.copy(P.phA); b.scale.setScalar(Math.max(0.05,w)); }

    /* binary fission in the biofilm */
    var fp=(at%5)/5, A=P.fisA, B=P.fisB;
    if(fp<0.45){ A.scale.y=1+1.1*(fp/0.45); A.position.x=0; B.visible=false; }
    else if(fp<0.55){ A.scale.y=2.1; B.visible=true; B.scale.y=0.9; B.position.x=0.25; A.position.x=-0.25; }
    else if(fp<0.9){ var s=(fp-0.55)/0.35; A.scale.y=2.1-1.1*s; A.position.x=-0.25-0.35*s; B.scale.y=0.9+0.1*s; B.position.x=0.25+0.35*s; }
    else { B.visible=false; A.scale.y=1; A.position.x=0; }
  }
});

      L.tails[0].position.set(L.x-0.15+wx, L.side*0.62+wy, L.z);
      L.tails[1].position.set(L.x+0.15+wx, L.side*0.62+wy, L.z);
    }

    /* molecules: free ones cross, blocked ones bounce, lane ones follow their protein */
    P.movers.forEach(function(m){
      var x = m.lane ? m.lane.position.x+m.x : m.x;
      if(m.type==='free') m.mesh.position.set(x, 6.2*Math.sin(at*m.speed+m.phase), m.z);
      else { var p=(Math.sin(at*m.speed+m.phase)+1)/2; m.mesh.position.set(x, m.side*(0.55+p*5.6), m.z); }
    });

    P.carGroup.scale.set(1+0.14*flex, 1-0.1*flex, 1+0.14*flex);

    var px=P.pumpGroup.position.x, ph=(at%6)/6;
    var naOut=tri(ph,0,0.32,0.85,0.97), kIn=tri(ph,0.42,0.72,0.80,0.94);
    P.pna.forEach(function(n){ n.m.position.set(px+n.dx, -1.6+naOut*3.3, n.z); });
    P.pk.forEach(function(k){ k.m.position.set(px+k.dx, 1.7-kIn*3.3, k.z); });

    P.atp.material.color.setHex(ph>=0.30 && ph<0.75 ? 0xB8842A : 0xF0A73A);
    P.pi.visible = ph>=0.30 && ph<0.55;

      {q:'Click a NEW strand — one built during replication.', keys:['new-strand'], enter:function(){ setMode('replication',9.5); },
       ok:'A new strand (pale backbone) paired with an old one: semiconservative.', hint:'The pale backbones on the inner side of each separated helix.'},
      {q:'Click the enzyme that makes mRNA from the DNA template.', keys:['rnapol'], enter:function(){ setMode('transcription',3); },

    ];
    var K=teachKit(self, {id:'dna', radius:30, stops:STOPS, quiz:QUIZ, onTourEnd:function(){ setMode('helix',0); }});
    var reg=K.register;

    /* ============================================================

    var helixGroup=new THREE.Group(); helixGroup.position.set(-9,0,0); g.add(helixGroup);

    for(var i=0;i<N;i++){

      s2pts.push(new THREE.Vector3(outerR*Math.cos(a+Math.PI), y, outerR*Math.sin(a+Math.PI)));

      var nb2=ball(0.24,nucColor(base2),14); nb2.position.copy(i2); strandB.add(nb2); reg(pkey, nb2, pinfo);
      var dots=[];
      for(var h=0; h<bonds; h++){ var dot=ball(0.08,0xEFE9F7,8); dot.position.lerpVectors(i1,i2,(h+1)/(bonds+1)); pairDots.add(dot); dots.push(dot); reg(pkey, dot, pinfo); }

    }
    var backbone1=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s1pts),80,0.18,8,false), mat(0x6B4BA8)); strandA.add(backbone1);
    var backbone2=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s2pts),80,0.18,8,false), mat(0x8A82A0)); strandB.add(backbone2);
    reg('backbone', backbone1, INFO.backbone); reg('backbone', backbone2, INFO.backbone);

    /* 5'/3' ends: discs mark 5', cones mark 3' */
    function endDisc(p){ var d=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.1,16), mat(0xEFE9F7)); d.position.copy(p); return d; }
    function endCone(p, down){ var c=new THREE.Mesh(new THREE.CylinderGeometry(0,0.26,0.5,12), mat(0xF0A73A)); c.position.copy(p); if(down) c.rotation.x=Math.PI; return c; }
    var d5a=endDisc(s1pts[0].clone().add(new THREE.Vector3(0,-0.45,0))); strandA.add(d5a); reg('prime5', d5a, INFO.prime5);
    var c3a=endCone(s1pts[N-1].clone().add(new THREE.Vector3(0,0.5,0)), false); strandA.add(c3a); reg('prime3', c3a, INFO.prime3);
    var d5b=endDisc(s2pts[N-1].clone().add(new THREE.Vector3(0,0.45,0))); strandB.add(d5b); reg('prime5', d5b, INFO.prime5);
    var c3b=endCone(s2pts[0].clone().add(new THREE.Vector3(0,-0.5,0)), true); strandB.add(c3b); reg('prime3', c3b, INFO.prime3);

    var pol1=polBlob(), pol2=polBlob(); pol1.visible=false; pol2.visible=false; strandA.add(pol1); strandB.add(pol2);
    reg('polymerase', pol1, INFO.polymerase); reg('polymerase', pol2, INFO.polymerase);
    var ligase=ball(0.42,0x7BC47F,14); ligase.scale.set(1.3,0.9,1); ligase.visible=false; strandB.add(ligase); reg('ligase', ligase, INFO.ligase);

    /* new strands: a complementary base beside each old base, dots between, pale backbone segments */
    var newA=new THREE.Group(), newB=new THREE.Group(); strandA.add(newA); strandB.add(newB);
    var new1=[], new2=[], ndots1=[], ndots2=[], nseg1=[], nseg2=[], gapSeg=[];
    function newBaseFor(d, side){
      var old = side===1 ? d.i1 : d.i2;
      var pos=new THREE.Vector3(old.x*0.72, d.y, old.z*0.72), oldOut=new THREE.Vector3(old.x*1.6, d.y, old.z*1.6);
      var b=ball(0.24, nucColor(COMP[side===1?d.b1:d.b2]), 14); b.position.copy(pos); b.visible=false;
      var dots=[]; for(var h=0; h<d.bonds; h++){ var dt=ball(0.07,0xEFE9F7,8); dt.position.lerpVectors(pos,oldOut,(h+1)/(d.bonds+1)); dt.visible=false; dots.push(dt); }

    }
    for(var ni=0; ni<N; ni++){
      var d=pairData[ni];
      var r1=newBaseFor(d,1), r2=newBaseFor(d,2);
      newA.add(r1.b); r1.dots.forEach(function(x){ newA.add(x); }); new1.push(r1); ndots1.push(r1.dots);
      newB.add(r2.b); r2.dots.forEach(function(x){ newB.add(x); }); new2.push(r2); ndots2.push(r2.dots);
    }
    for(var si=1; si<N; si++){
      var sA=segment(new1[si-1].pos,new1[si].pos,0.1,NEWBB); sA.visible=false; newA.add(sA); nseg1.push(sA);
      var sB=segment(new2[si-1].pos,new2[si].pos,0.1,NEWBB); sB.visible=false; newB.add(sB); nseg2.push(sB);

    reg('new-strand', newA, INFO['new-strand']); reg('new-strand', newB, INFO['new-strand']);
    var WRONG=0xF0A73A; /* rung 5 should get A (pink); a G (amber) goes in first and is proofread away */

    var mrna2=new THREE.Group(), startCodon=new THREE.Group(); transGroup.add(mrna2, startCodon);

    for(var ts=1; ts<N; ts++) (ts<3?startCodon:mrna2).add(segment(mrna2Pts[ts-1],mrna2Pts[ts],0.06,0x5E5678));

  tick:function(t){

      for(var dj=0; dj<d.dots.length; dj++) d.dots[dj].visible=!open;

  }
});

/* ============================================================

MODELS.push({

  build:function(ctx){

      'product':{tag:'Reaction', title:'Product (cross-linked peptidoglycan)',
        body:'What leaves the active site: the two stems now joined by a cross-link. Stacked up, these cross-links are the mesh that keeps a bacterium from bursting under its own pressure.'},
      'wall':{tag:'Reaction', title:'Peptidoglycan wall',
        body:'Sugar chains tied together by the cross-links transpeptidase makes. Human cells have no wall and no transpeptidase — so a drug that stops this enzyme harms the bacterium and not you. That is selective toxicity.'},
      'wrong-substrate':{tag:'Specificity', title:'Non-matching molecule',
        body:'The wrong shape and charge for this active site, so it bumps off without binding. Specificity is why lactase acts on lactose and nothing else — and why one drug can target one enzyme.'},
      'penicillin':{tag:'Competitive inhibitor', title:'Penicillin',

      'fragments':{tag:'Resistance', title:'Hydrolyzed penicillin',

      'ea-cat':{tag:'Activation energy', title:'With the enzyme',

    var STOPS=[

    for(var wy=-2; wy<=2; wy+=1){ [-0.45,0.45].forEach(function(x){ var cl=rod(0.06,0.9,0xF0A73A); cl.rotation.z=Math.PI/2; cl.position.set(x,wy,0); wall.add(cl); }); }

  tick:function(t){
    var self=this, P=self._parts; if(!P) return;
    var f=self._K.tick(t), at=f.at;

    var ph=(ta%5)/5;

    var working = mode!=='penicillin' && mode!=='noncomp' && den<0.15;
    var closeAmt = working ? (ph>=0.25&&ph<0.55 ? (ph-0.25)/0.3 : ph>=0.55&&ph<0.9 ? 1-(ph-0.55)/0.35 : 0) : 0;
    var bound = mode==='noncomp' ? clamp((lt-1.2)/0.6,0,1) : 0;

    P.tp.B.position.x=1.3-closeAmt*0.2+bound*0.35+den*0.9; P.tp.B.rotation.z=-bound*0.55-den*0.9;
    P.tp.mat.color.lerpColors(P.tp.healthy,P.tp.dull,den);

    var S=P.substrate, PR=P.product, site=P.TP;

      var from=site.clone().add(new THREE.Vector3(0,3.4,0));
      if(ph<0.25){ S.visible=true; S.position.lerpVectors(from,site,ph/0.25); PR.visible=false; }
      else if(ph<0.5){ S.visible=true; S.position.copy(site); PR.visible=false; }
      else if(ph<0.9){ S.visible=false; PR.visible=true; var u=(ph-0.5)/0.4; PR.position.lerpVectors(site, site.clone().add(new THREE.Vector3(-4.6,0.5,0)), u); PR.scale.setScalar(0.75*(1-0.6*u)); }

    P.noncomp.visible = mode==='noncomp';
    if(mode==='noncomp'){ var na=clamp(lt/1.2,0,1); P.noncomp.position.lerpVectors(site.clone().add(new THREE.Vector3(3.2,3.2,1.2)), site.clone().add(new THREE.Vector3(2.3+den*0.9,0.4,0.8)), na); P.noncomp.rotation.y=at; }

    P.bl.B.position.x=1.3-bclose*0.2+den*0.9; P.bl.B.rotation.z=-den*0.9;

    }

    /* ---------- activation-energy diagram and rate gauge ---------- */
    var hc=((at*Math.max(rate,0.2)*0.5)%2)/2, xc=-3+6*hc;
    P.ballC.position.copy(P.onHill(P.caPts, xc)).add(new THREE.Vector3(0,0.2,0));

    P.gauge.scale.y=h; P.gauge.position.set(0,-5.55+h/2,0);
    P.gauge.material.color.setHex(den>0.5 ? 0x8A8272 : rate>0.85 ? 0xE0417B : 0xF0A73A);
  }

/* ============================================================
   MODEL 5 — Cell Cycle, Mitosis & Meiosis (Levels 17–18)
   Eight chromatids (2 homologous pairs, maternal pink / paternal
   blue) whose positions are pure functions of (mode, phase). A cell-
   cycle wheel (G1/S/G2/M with checkpoints) tracks where the cell is.
   Mitosis: G1 -> S (replication) -> prophase -> metaphase -> anaphase

   two identical cells -> differentiation -> what happens when the
   checkpoints fail (cancer). Meiosis: crossing over, independent
   assortment (reshuffled each visit), the reduction division, meiosis
   II, four distinct gametes, fertilization to a zygote, and
   nondisjunction. Tour + Quiz via teachKit; a Mode button toggles
   mitosis/meiosis for free exploration.
   ============================================================ */

      'maternal':{tag:'Chromosome', title:'Maternal chromosome',

      'partner':{tag:'Fertilization', title:'Chromosome from the other gamete',

      'spindle':{tag:'Division', title:'Spindle fiber',

      'plate':{tag:'Division', title:'Metaphase plate',
        body:'The cell’s equator, where chromosomes line up before being pulled apart. In meiosis I it is homologous pairs that line up here, and which homolog faces which pole is random — independent assortment.'},
      'daughter':{tag:'Mitosis', title:'Daughter cell',

      'cell-plate':{tag:'Cytokinesis', title:'Cell plate',

      'cycle-g1':{tag:'Cell cycle', title:'G1 — growth',
        body:'Most of the cycle. The cell grows and does its job. At the end of G1 a checkpoint asks whether conditions and DNA are good enough to commit to copying.'},
      'cycle-s':{tag:'Cell cycle', title:'S — synthesis',

      'gamete':{tag:'Meiosis', title:'Gamete',
        body:'A haploid cell — one chromosome from each pair, 23 in a human sperm or egg — and genetically distinct from every other gamete thanks to crossing over and independent assortment.'},
      'gamete-aneuploid':{tag:'Nondisjunction', title:'Gamete with the wrong number',
        body:'A pair failed to separate, so this gamete has an extra chromosome or is missing one. Fertilized, an extra copy makes a trisomy — three copies of chromosome 21 is Down syndrome, 47 chromosomes instead of 46.'},

    /* ---------- tour + quiz ---------- */
    function setPhase(mode, phase, opt){
      opt=opt||{};
      if(opt.reshuffle) self._orient=[Math.random()<0.5, Math.random()<0.5];

      if(modeBtn) modeBtn.textContent = mode==='mitosis' ? 'Mode: mitosis' : 'Mode: meiosis';
    }
    var STOPS=[
      {tag:'Cell cycle', focus:'cycle-g1', r:7, keys:['cycle-g1','cycle-s','cycle-g2','cycle-m','checkpoint'], set:['mitosis','g1'], title:'The cell cycle',
       body:'Most of a cell’s life is interphase: G1 growth, S when DNA is copied, G2 preparation. Division — M — is the short last arc. The white beads are checkpoints: before each transition, signals verify the DNA is intact and the job is done, or the cycle halts for repair.'},
      {tag:'S phase', focus:'maternal', r:10, keys:['maternal','paternal','centromere'], set:['mitosis','s'], title:'S phase: every chromosome is copied',
       body:'In G1 each chromosome was a single chromatid. In S phase it is replicated into two identical sister chromatids joined at a centromere. The chromosome count has not changed — 46 chromosomes, now with twice the DNA, ready to be shared out.'},

       body:'Chromosomes condense into the thick X shapes you can see. The nuclear envelope breaks down, and spindle fibers grow from the two poles to reach each centromere.'},

       body:'A for apart. The centromeres let go and each sister chromatid is pulled to the opposite pole. Each end now holds a complete set — this step is what guarantees both daughters get everything.'},
      {tag:'Cytokinesis', focus:'daughter', r:11, keys:['daughter'], set:['mitosis','telophase',{cyto:'animal'}], title:'Telophase and an animal cell’s cleavage furrow',

      {tag:'Mitosis', focus:'daughter', r:11, keys:['daughter'], set:['mitosis','result'], title:'Two identical diploid cells',

      {tag:'Differentiation', focus:'daughter', r:11, keys:['daughter'], set:['mitosis','differentiation'], title:'Same genome, different genes switched on',

      {tag:'Cancer', focus:'tumor', r:9, keys:['tumor','checkpoint'], set:['mitosis','cancer'], title:'When the checkpoints fail',

      {tag:'Meiosis', focus:'recombinant', r:9, keys:['recombinant'], set:['meiosis','prophaseI'], title:'Prophase I: crossing over',
       body:'Meiosis starts like mitosis — chromosomes already copied — then does something mitosis never does: homologous pairs come together as tetrads and swap segments. Watch the tips trade colors. New allele combinations, before a single division has happened.'},

       body:'Pairs, not single chromosomes, line up on the plate — and which homolog faces which pole is random for every pair. Visit this stop again and the arrangement reshuffles. With 23 pairs that is 2²³, over 8 million, possible gametes from orientation alone.'},
      {tag:'Meiosis', focus:'maternal', r:10, keys:['maternal','paternal','recombinant','spindle'], set:['meiosis','anaphaseI'], title:'Anaphase I — the reduction division',
       body:'Homologous pairs separate; sister chromatids stay together. Each pole now has half the pairs — the chromosome number has just been halved. This is the step that makes meiosis different from mitosis, and why a gamete ends up with 23 instead of 46.'},
      {tag:'Meiosis', focus:'maternal', r:10, keys:['maternal','paternal','spindle'], set:['meiosis','meiosisII'], title:'Meiosis II: sisters finally separate',
       body:'Each of the two cells divides again, and this time it is the sister chromatids that are pulled apart — the same event as mitotic anaphase, but starting from a haploid set. One replication, two divisions.'},
      {tag:'Meiosis', focus:'gamete', r:12, keys:['gamete'], set:['meiosis','result'], title:'Four genetically distinct haploid gametes',

       body:'One gamete from this cell meets a gamete from the other parent. n + n = 2n: the zygote has 46 chromosomes again, in a combination that has never existed. Sexual reproduction’s whole point is this variation — the raw material natural selection works on.'},

    function chromatidMesh(color,len){

    function topPole(c){

    self._parts={CHROM:CHROM, PARTNER:PARTNER, SISTER_PAIRS:SISTER_PAIRS, connectors:connectors, fibers:fibers, stretch:stretch, target:target, chromVisible:chromVisible, topPole:topPole,

  tick:function(t){

  tick:function(t){
    var self=this, P=self._parts; if(!P) return;
    var f=self._K.tick(t), at=f.at, dt=f.dt;
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

    /* generations tick on the animation clock (frozen during a quiz) */
    if(at-self._lastGen>P.GEN){ P.stepGeneration(); self._lastGen=at; }
    /* a plasmid crosses to a neighbor now and then on its own */
    if(!self._arc && Math.random()<dt*0.08){ var any=P.slots.some(function(s){ return s.alive&&s.res; }); if(any) self._startArcAuto=true; }

      var u=(at-self._pulse)/1.2;

      else { P.pulse.visible=true; var rr=0.6+4.9*u; P.pulse.scale.set(rr,1,rr); P.pulse.material.opacity=0.4*(1-u); }
    } else P.pulse.visible=false;

      if(at-A.start>2.4){ self._arc=null; P.plasmid.visible=false; }
    } else P.plasmid.visible=false;
  }
});

      scenSel=document.createElement('select'); scenSel.id='arteryScen';
      scenSel.style.cssText='font:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:7px;border:1px solid var(--track);background:rgba(255,255,255,.75);color:var(--page-mute);cursor:pointer';
      [['baseline','Scenario: baseline'],['satfat','Scenario: high saturated fat'],['fiber','Scenario: fiber + exercise'],['fh','Scenario: FH gene, clean diet']].forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; scenSel.appendChild(op); });
      document.getElementById('bar').insertBefore(scenSel, document.getElementById('lvl'));
    }
    scenSel.setAttribute('data-model-ui','artery'); scenSel.onchange=function(){ setScen(scenSel.value); };
    var resetBtn=K.button('arteryReset','btn ghost','Reset artery'); resetBtn.onclick=function(){ setPlaque(0.05); setRupture(0); crack.visible=false; };
    act('baseline');

    self._parts={plaque:plaque, cap:cap, crack:crack, dots:dots, macs:macs, clot:clot, rbcs:rbcs, ldls:ldls, hdls:hdls, liver:liver, gene:gene, chol:chol, anchorL:anchorL, anchorH:anchorH,
      readoutLabel:readoutLabel, plaqueLabel:plaqueLabel, setText:setText, setScen:setScen, setPlaque:setPlaque, respawn:respawn, startDive:startDive, SCEN:SCEN, PX:PX, N_DOTS:N_DOTS, tmp:new THREE.Vector3(),
      toggleFH:function(){ setScen(self._scen==='fh'?'baseline':'fh'); }};
  },
  onPick:function(info){ var r=this._K.onPick(info); if(info && info.key==='gene' && !this._K.quiz) this._parts.toggleFH(); return r; },
  onReset:function(){ this._K.onReset(); },

  tick:function(t){
    var self=this, P=self._parts; if(!P) return;
    var f=self._K.tick(t), at=f.at, dt=(self._K.quiz?0:f.dt), S=P.SCEN[self._scen], p=self._p, PX=P.PX;
    var L=2.2+1.2*p, H=0.15+1.6*p, W=1.3+0.8*p;
    var flow=Math.max(0,(1-0.55*p)*(1-self._rupt));
    function ytop(x){ var q=(x-PX)/L; return -2.2+H*Math.sqrt(Math.max(0,1-q*q)); }

    /* plaque geometry follows p; cap appears with growth; rupture grows the clot */
    P.plaque.scale.set(L,H,W); P.cap.scale.set(L*1.04,H*1.04+0.04,W*1.04); P.cap.visible=p>0.35;
    if(p>=1 && self._rupt<1) self._rupt=Math.min(1,self._rupt+dt*0.5);
    var ru=self._rupt; P.clot.visible=ru>0.02; P.clot.scale.setScalar(Math.max(0.01,ru)); P.clot.position.y=-2.2+H+0.3; P.crack.visible=ru>0.02; P.crack.position.set(PX,-2.2+H,0);
    P.cap.material.color.setHex(ru>0.02?0xB04060:0xE8A0B0);
    P.dots.forEach(function(dm){ if(!dm.visible) return; var u=dm.userData.u; dm.position.set(PX+u[0]*L, -2.2+u[1]*H, u[2]*W); });
    var nm=p>0.15?Math.min(4,Math.ceil(p*5)):0;
    P.macs.forEach(function(mc,i){ mc.visible=i<nm; if(!mc.visible) return; var u=mc.userData.u; mc.position.set(PX+u[0]*L+Math.sin(at*0.7+i)*0.15, -2.2+u[1]*H, u[2]*W); mc.material.color.setHex(p>0.45?0xF2E6A0:0xEFE9F7); });

    /* red cells ride the flow, deflected over the plaque */
    P.rbcs.forEach(function(rc){ var s=rc.userData.s; s.x+=dt*2.4*flow*s.sp; if(s.x>8.6){ s.x=-8.6; s.y=(Math.random()*2-1)*1.5; s.z=(Math.random()*2-1)*1.4; }
      var y=s.y; if(Math.abs(s.z)<W+0.3) y=Math.max(y, ytop(s.x)+0.35); rc.position.set(s.x, y, s.z); rc.rotation.x+=dt*flow*0.8; });

    /* lipoproteins: flow, dive (LDL deposits), dock (HDL collects), carry to the liver */
    var firstL=null, firstH=null;
    function stepLipo(pt){
      var s=pt.userData.s; if(!pt.visible) return;
      if(s.phase==='flow'){
        var was=s.x; s.x+=dt*2.2*flow*s.sp;
        if(s.x>8.6) P.respawn(pt,false);
        if(was<PX-1.8 && s.x>=PX-1.8 && flow>0.1){
          if(s.kind==='ldl' && Math.random()<S.dive && self._rupt<0.02) P.startDive(pt);
          else if(s.kind==='hdl' && Math.random()<S.dock && self._rupt<0.02){ var vis=P.dots.filter(function(d){ return d.visible; }); if(vis.length){ var dm=vis[Math.floor(Math.random()*vis.length)]; s.phase='dock'; s.t=0; s.dot=dm; } }
        }
        var y=s.y; if(Math.abs(s.z)<W+0.3) y=Math.max(y, ytop(s.x)+0.4); pt.position.set(s.x, y+Math.sin(at*2+s.x)*0.08, s.z);
      } else if(s.phase==='dive'){
        s.t+=dt; var u=Math.min(1,s.t/1.0); var e=u*u*(3-2*u); var ty=ytop(s.tx)+0.05;
        pt.position.set(s.x+(s.tx-s.x)*e, s.y+(ty-s.y)*e, s.z+(s.tz-s.z)*e);
        if(u>=1){ P.setPlaque(self._p+1/P.N_DOTS); self._flash=at; P.respawn(pt,false); }
      } else if(s.phase==='dock'){
        s.t+=dt; var u2=Math.min(1,s.t/0.9); var e2=u2*u2*(3-2*u2); var dp=s.dot.position;
        pt.position.set(s.x+(dp.x-s.x)*e2, s.y+(dp.y+0.3-s.y)*e2, s.z+(dp.z-s.z)*e2);
        if(u2>=1){ if(s.dot.visible){ P.setPlaque(self._p-1/P.N_DOTS); } pt.userData.cargo.visible=true; s.phase='liver'; s.t=0; s.x=pt.position.x; s.y=pt.position.y; s.z=pt.position.z; }
      } else if(s.phase==='liver'){
        s.t+=dt; var u3=Math.min(1,s.t/2.2); var lv=P.liver.position;
        var mx=(s.x+lv.x)/2, my=Math.max(s.y,lv.y)+0.8;
        var a=1-u3; pt.position.set(a*a*s.x+2*a*u3*mx+u3*u3*lv.x, a*a*s.y+2*a*u3*my+u3*u3*lv.y, a*a*s.z+2*a*u3*(s.z+1.5)+u3*u3*lv.z);
        if(u3>=1) P.respawn(pt,false);
      }
      pt.rotation.y=at*1.2; pt.rotation.z=at*0.5;
      if(s.kind==='ldl' && !firstL && s.phase==='flow') firstL=pt; if(s.kind==='hdl' && !firstH && s.phase==='flow') firstH=pt;
    }
    P.ldls.forEach(stepLipo); P.hdls.forEach(stepLipo);
    if(firstL){ P.anchorL.visible=true; P.anchorL.position.copy(firstL.position); } else P.anchorL.visible=false;
    if(firstH){ P.anchorH.visible=true; P.anchorH.position.copy(firstH.position); } else P.anchorH.visible=false;
    var fl=Math.max(0,1-(at-self._flash)/0.6); if(self._K.glow.indexOf(P.plaque)<0){ P.plaque.material.emissive.setHex(0xFFF0A0); P.plaque.material.emissiveIntensity=fl*0.6; }
    P.gene.rotation.y=at*0.6; P.chol.rotation.y=Math.sin(at*0.5)*0.4;
    P.setText(P.readoutLabel, 'LDL '+S.ldl+' · HDL '+S.hdl+' · flow '+Math.round(flow*100)+'% · '+S.label);
    P.setText(P.plaqueLabel, ru>0.02?'Plaque · ruptured':'Plaque · '+Math.round(p*100)+'% grown');
  }
});

boot();
</script>
</body>
