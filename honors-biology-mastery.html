BANK[18]=[{"q": "Meiosis produces:", "o": ["Two identical diploid cells", "Four genetically distinct haploid cells", "One diploid zygote", "Two haploid clones"], "a": 1, "e": "One round of DNA replication followed by two divisions halves the chromosome number and generates variation."}, {"q": "Meiosis I separates:", "o": ["Sister chromatids", "Homologous chromosome pairs", "Centrioles", "Nuclei only"], "a": 1, "e": "Homologs separate in meiosis I; sister chromatids separate in meiosis II — the same event as mitotic anaphase."}, {"q": "Crossing over occurs during:", "o": ["Prophase I", "Metaphase II", "Anaphase II", "Telophase I"], "a": 0, "e": "Homologous chromosomes pair as tetrads and exchange segments — a major source of new allele combinations."}, {"q": "Independent assortment generates variation because:", "o": ["Chromosomes replicate twice", "Homologous pairs orient randomly at the metaphase I plate", "Crossing over is prevented", "Gametes fuse at random"], "a": 1, "e": "With 23 pairs, random orientation alone yields 2²³ — over 8 million — possible gametes."}, {"q": "A human gamete contains how many chromosomes?", "o": ["23", "46", "92", "22"], "a": 0, "e": "Haploid (n) = 23. Fertilization restores the diploid 46."}, {"q": "Which is a difference between mitosis and meiosis?", "o": ["Mitosis has one division; meiosis has two", "Mitosis produces haploid cells; meiosis produces diploid cells", "Only mitosis requires DNA replication", "Only meiosis occurs in eukaryotes"], "a": 0, "e": "One replication plus two divisions is what halves the chromosome number in meiosis."}, {"q": "Fertilization of an egg by a sperm produces a:", "o": ["Haploid gamete", "Diploid zygote", "Tetrad", "Clone of the mother"], "a": 1, "e": "n + n = 2n, restoring the species' diploid number with a novel allele combination."}, {"q": "Sexual reproduction benefits a population because it:", "o": ["Requires less energy than asexual reproduction", "Produces genetic variation that improves the population's chance of surviving change", "Produces more offspring per parent", "Guarantees identical offspring"], "a": 1, "e": "Variation is the raw material natural selection acts on; a genetically uniform population is fragile."}, {"q": "Nondisjunction is the failure of:", "o": ["The cell membrane to divide", "Chromosomes to separate properly during meiosis", "DNA to replicate", "Crossing over to occur"], "a": 1, "e": "It produces gametes with an extra or a missing chromosome."}, {"q": "Down syndrome results from nondisjunction producing:", "o": ["A missing chromosome 21", "Three copies of chromosome 21", "An inverted chromosome 21", "A translocated chromosome 1"], "a": 1, "e": "Trisomy 21 — 47 chromosomes total rather than 46."}];
BANK[19]=[{"q": "Mendel's law of segregation states that:", "o": ["Genes on different chromosomes assort independently", "The two alleles for a trait separate during gamete formation", "Dominant alleles are more common", "Traits blend in offspring"], "a": 1, "e": "Each gamete receives only one allele of each pair, which is why offspring get one from each parent."}, {"q": "A cross of Aa × Aa yields which phenotype ratio?", "o": ["1:1", "3:1", "9:3:3:1", "1:2:1"], "a": 1, "e": "3 dominant to 1 recessive. The 1:2:1 ratio describes genotypes, not phenotypes."}, {"q": "Two unaffected parents have a child with a recessive condition. The parents must both be:", "o": ["Homozygous dominant", "Heterozygous carriers", "Homozygous recessive", "Affected themselves"], "a": 1, "e": "The child inherited a recessive allele from each parent, so each parent carried one without expressing it."}, {"q": "A polygenic trait is one that is:", "o": ["Controlled by a single gene with two alleles", "Influenced by many genes, each contributing a small effect", "Found only on the X chromosome", "Unaffected by the environment"], "a": 1, "e": "Many small contributions produce a continuous, bell-shaped distribution rather than two or three distinct categories."}, {"q": "A multifactorial trait differs from a purely polygenic one in that a multifactorial trait is shaped by:", "o": ["Only one gene", "Multiple genes together with environmental factors", "No genes at all", "Chromosome number only"], "a": 1, "e": "Heart disease is the unit's example: genotype sets a predisposition, and diet, exercise, and smoking substantially move the outcome."}, {"q": "Familial hypercholesterolemia is unusual among heart-disease risk factors because it is:", "o": ["Caused entirely by diet", "A single-gene disorder producing very high LDL from early life", "Not heritable", "Only found in adults over 70"], "a": 1, "e": "It is the exception that illustrates the rule — most cardiovascular risk is distributed across many genes of small effect, not one."}, {"q": "Two siblings inherit different combinations of risk alleles from the same parents. This is primarily because of:", "o": ["Mutations occurring after birth", "Independent assortment and crossing over during meiosis, plus random fertilization", "Differences in their diets", "The order in which they were born"], "a": 1, "e": "Each gamete carries a different shuffle, which is why siblings share about half their genome rather than all of it."}, {"q": "A person with a high polygenic risk score for heart disease should understand that the score indicates:", "o": ["A certainty that they will develop the disease", "An elevated probability relative to the population, not a determined outcome", "That lifestyle changes are pointless", "That they already have the disease"], "a": 1, "e": "Risk is probabilistic. For multifactorial conditions the modifiable factors often matter as much as the inherited ones."}, {"q": "Identical twins raised apart show different rates of heart disease. This is evidence that:", "o": ["Genes have no influence on the disease", "Environment and behavior influence the expression of genetic risk", "The twins are not actually identical", "Heart disease is purely inherited"], "a": 1, "e": "Twin studies are the standard tool for separating heritable contribution from environmental contribution."}, {"q": "Why is it inaccurate to say there is 'a gene for' heart disease?", "o": ["Heart disease has no genetic component", "Dozens to hundreds of genetic variants each contribute small amounts of risk, interacting with environment", "Only one gene has been discovered so far", "Genes do not affect the heart"], "a": 1, "e": "Single-gene framing works for conditions like sickle cell but badly misrepresents the architecture of common complex disease."}];
BANK[21]=[{"q": "Food provides the body with two fundamentally different things:", "o": ["Water and salt only", "Energy, and raw materials for building and repairing structures", "Vitamins and nothing else", "Oxygen and carbon dioxide"], "a": 1, "e": "A diet can supply plenty of Calories and still fail — energy and building blocks are separate requirements."}, {"q": "An 'essential' nutrient is one that:", "o": ["Provides the most energy", "The body cannot synthesize and must obtain from food", "Is needed in the largest amount", "Is stored indefinitely"], "a": 1, "e": "Essential amino acids, essential fatty acids, vitamins, and minerals all share this definition."}, {"q": "Digestion of a protein into amino acids is an example of:", "o": ["Dehydration synthesis", "Hydrolysis", "Photosynthesis", "Active transport"], "a": 1, "e": "Water is added across each peptide bond to break the polymer into monomers small enough to absorb."}, {"q": "Macronutrients differ from micronutrients in that macronutrients:", "o": ["Are more important to health", "Are required in large quantities and supply energy", "Are only found in meat", "Cannot be stored"], "a": 1, "e": "Carbohydrates, lipids, and proteins are the macronutrients; vitamins and minerals are micronutrients — needed in trace amounts but not optional."}, {"q": "A protein source described as 'complete' is one that:", "o": ["Contains every vitamin", "Supplies all essential amino acids in adequate amounts", "Has no fat", "Is entirely plant-based"], "a": 1, "e": "Most animal proteins are complete; many individual plant proteins are limited in one or more, which is why complementary combinations matter."}, {"q": "After digestion, glucose absorbed from a meal is primarily used to:", "o": ["Build DNA", "Be broken down in cellular respiration to regenerate ATP", "Form the cell membrane", "Act as an enzyme"], "a": 1, "e": "This connects nutrition directly to the respiration pathway — food energy becomes ATP energy."}, {"q": "Excess Calories consumed beyond immediate needs are chiefly stored as:", "o": ["Additional DNA", "Glycogen in the short term and body fat in the longer term", "Extra enzymes", "Free amino acids in the blood"], "a": 1, "e": "Glycogen stores are limited and fill quickly; triglyceride storage is effectively open-ended."}, {"q": "Scurvy results from a deficiency of vitamin C, which is needed to build collagen. This illustrates that:", "o": ["Vitamins supply most of our energy", "A micronutrient needed in tiny amounts can be essential to a major structural protein", "Collagen is a carbohydrate", "Deficiencies affect only energy levels"], "a": 1, "e": "The quantity required tells you nothing about how critical the nutrient is."}, {"q": "Dietary fiber is valuable even though humans cannot digest it because fiber:", "o": ["Provides the most Calories", "Adds bulk, slows sugar absorption, and supports gut function and microbes", "Is converted directly into protein", "Replaces the need for water"], "a": 1, "e": "We lack the enzyme to hydrolyze cellulose, so it passes through — and the passing through is the benefit."}, {"q": "A person eating enough Calories can still be malnourished if the diet:", "o": ["Contains any fat", "Lacks essential amino acids, vitamins, or minerals", "Includes carbohydrates", "Is eaten in three meals"], "a": 1, "e": "Caloric sufficiency and nutritional adequacy are different measures, which is why both are tracked in global food-security work."}];
BANK[22]=[{"q": "ATP is composed of:", "o": ["Adenine, ribose, and three phosphate groups", "Glycerol and three fatty acids", "Two amino acids and a phosphate", "A nitrogen base and a deoxyribose sugar"], "a": 0, "e": "It is a modified nucleotide — the same building block family as RNA."}, {"q": "Energy is released from ATP when:", "o": ["A fourth phosphate is added", "The bond holding the terminal phosphate is broken, leaving ADP", "Adenine is removed", "Ribose is oxidized"], "a": 1, "e": "ATP → ADP + inorganic phosphate releases usable energy; recharging ADP back to ATP requires an energy input."}, {"q": "ATP is best described as the cell's:", "o": ["Long-term energy storage molecule", "Immediate, usable energy currency", "Genetic material", "Structural protein"], "a": 1, "e": "Cells hold very little ATP at a time and continuously regenerate it — lipids and carbohydrates are the storage forms."}, {"q": "Which organelle regenerates most of a cell's ATP?", "o": ["Chloroplast", "Mitochondrion", "Golgi apparatus", "Nucleus"], "a": 1, "e": "Aerobic respiration in the mitochondrion produces roughly 34 of the ~36 ATP per glucose."}, {"q": "Mitochondria are found in:", "o": ["Animal cells only", "Plant cells only", "Both plant and animal cells", "Prokaryotic cells only"], "a": 2, "e": "Plants photosynthesize and also respire — they need mitochondria to release the energy they store."}, {"q": "Chloroplasts capture light using pigment held in stacked membranes called:", "o": ["Cristae", "Thylakoids, stacked into grana", "Ribosomes", "Vacuoles"], "a": 1, "e": "The fluid surrounding the grana is the stroma, where the Calvin cycle runs."}, {"q": "Plastids such as chloroplasts and mitochondria both:", "o": ["Lack membranes", "Have a double membrane and their own circular DNA", "Are found only in animals", "Digest cellular waste"], "a": 1, "e": "Those shared features are the core evidence for endosymbiotic theory."}, {"q": "Which cell would you expect to contain the greatest number of mitochondria?", "o": ["A cardiac muscle cell", "A mature red blood cell", "A fat storage cell", "A dead skin cell"], "a": 0, "e": "Organelle abundance tracks energy demand — a heart muscle cell never stops contracting."}, {"q": "The energy transformation carried out by a chloroplast is:", "o": ["Chemical energy into light energy", "Light energy into chemical energy stored in glucose", "Chemical energy into heat only", "Heat into chemical energy"], "a": 1, "e": "Mitochondria perform the complementary transformation: chemical energy in glucose into chemical energy in ATP."}, {"q": "A cell treated with a poison that blocks ATP production would first lose the ability to:", "o": ["Let oxygen diffuse inward", "Run active transport pumps and build macromolecules", "Let water cross by osmosis", "Let carbon dioxide diffuse outward"], "a": 1, "e": "Passive processes need no ATP; every energy-requiring process stops immediately."}];
BANK[23]=[{"q": "The balanced equation for photosynthesis is:", "o": ["C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "6CO₂ + 6O₂ → C₆H₁₂O₆", "C₆H₁₂O₆ → 2 lactic acid"], "a": 1, "e": "Carbon dioxide and water in, glucose and oxygen out, powered by light."}, {"q": "The light-dependent reactions occur in the:", "o": ["Stroma", "Thylakoid membranes", "Mitochondrial matrix", "Cytoplasm"], "a": 1, "e": "Photosystems embedded in thylakoid membranes capture the light energy."}, {"q": "The oxygen released during photosynthesis comes from:", "o": ["Carbon dioxide", "The splitting of water", "Glucose", "The soil"], "a": 1, "e": "Photolysis splits H₂O to replace electrons in photosystem II; O₂ is essentially a waste product."}, {"q": "The Calvin cycle uses which products of the light reactions?", "o": ["Oxygen and water", "ATP and NADPH", "Chlorophyll and CO₂", "Glucose and O₂"], "a": 1, "e": "The light reactions convert light into ATP and NADPH; the Calvin cycle spends both to reduce CO₂ into sugar."}, {"q": "Chlorophyll appears green because it:", "o": ["Absorbs green light most strongly", "Reflects green light while absorbing red and blue", "Manufactures green pigment from CO₂", "Converts light into the color green"], "a": 1, "e": "The color you see is the wavelength the pigment does not use."}, {"q": "The Calvin cycle takes place in the:", "o": ["Thylakoid lumen", "Stroma", "Cytoplasm", "Nucleus"], "a": 1, "e": "The stroma is the fluid surrounding the grana, where the CO₂-fixing enzymes operate."}, {"q": "Which would act as a limiting factor slowing photosynthesis?", "o": ["Increased light up to the saturation point", "Adequate water supply", "Very low CO₂ concentration", "Optimal temperature"], "a": 2, "e": "Light intensity, CO₂ concentration, and temperature all limit rate — whichever is in shortest supply sets the ceiling."}, {"q": "Photosynthesis is described as an energy-storing process because it:", "o": ["Releases energy as heat", "Converts light energy into chemical bond energy in glucose", "Breaks down glucose", "Requires no energy input"], "a": 1, "e": "Energy stored in the bonds of glucose is later released by cellular respiration."}, {"q": "Gas exchange for photosynthesis occurs mainly through leaf openings called:", "o": ["Cuticles", "Stomata", "Xylem vessels", "Grana"], "a": 1, "e": "Guard cells open and close stomata, balancing CO₂ intake against water loss."}, {"q": "An aquatic plant produces oxygen bubbles faster as light intensity rises, then levels off. The plateau occurs because:", "o": ["The plant has died", "Another factor such as CO₂ or temperature has become limiting", "Light stopped reaching it", "Oxygen inhibits photosynthesis"], "a": 1, "e": "Once light is no longer the factor in shortest supply, adding more of it cannot raise the rate."}];
BANK[24]=[{"q": "The overall equation for aerobic cellular respiration is:", "o": ["6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP", "C₆H₁₂O₆ → 2 ethanol + 2CO₂", "6O₂ + ATP → glucose"], "a": 1, "e": "It is essentially photosynthesis run in reverse, releasing the stored energy as ATP."}, {"q": "Glycolysis occurs in the:", "o": ["Mitochondrial matrix", "Cytoplasm", "Inner mitochondrial membrane", "Nucleus"], "a": 1, "e": "Because glycolysis is cytoplasmic and anaerobic, even prokaryotes without mitochondria can run it."}, {"q": "Glycolysis splits one glucose molecule into:", "o": ["Two molecules of pyruvate", "Six molecules of CO₂", "Two molecules of lactic acid directly", "One acetyl-CoA"], "a": 0, "e": "Net yield is 2 ATP and 2 NADH along with the 2 pyruvate."}, {"q": "The Krebs (citric acid) cycle occurs in the:", "o": ["Cytoplasm", "Mitochondrial matrix", "Thylakoid", "Ribosome"], "a": 1, "e": "The matrix is the innermost mitochondrial compartment, enclosed by the cristae."}, {"q": "In the electron transport chain, the final electron acceptor is:", "o": ["NAD⁺", "Carbon dioxide", "Oxygen", "Pyruvate"], "a": 2, "e": "Oxygen combines with electrons and H⁺ to form water — the reason you must breathe."}, {"q": "Aerobic respiration of one glucose molecule yields approximately:", "o": ["2 ATP", "4 ATP", "36 ATP", "100 ATP"], "a": 2, "e": "About 34 of those come from the electron transport chain, which is why oxygen matters so much."}, {"q": "The main purpose of fermentation in a cell is to:", "o": ["Produce large amounts of ATP", "Regenerate NAD⁺ so glycolysis can continue without oxygen", "Produce oxygen", "Break down proteins"], "a": 1, "e": "Without recycled NAD⁺, glycolysis halts. Fermentation itself produces no additional ATP."}, {"q": "Lactic acid fermentation occurs in:", "o": ["Yeast leavening bread", "Human muscle cells during intense exercise", "Plant leaves at night", "Mitochondria only"], "a": 1, "e": "When oxygen delivery lags behind demand, muscle converts pyruvate to lactate to keep glycolysis running."}, {"q": "Alcoholic fermentation produces:", "o": ["Lactic acid and ATP", "Ethanol and carbon dioxide", "Water and oxygen", "Glucose and NADH"], "a": 1, "e": "The CO₂ makes bread rise; the ethanol is what brewing depends on."}, {"q": "Which statement about photosynthesis and respiration is correct?", "o": ["Both occur only in plants", "Photosynthesis stores energy and respiration releases it; the products of each are the reactants of the other", "Both release oxygen", "Respiration occurs only in animals"], "a": 1, "e": "Plants do both — they photosynthesize in light and respire continuously, including at night."}];
BANK[25]=[{"q": "Which sequence lists ecological levels from smallest to largest?", "o": ["Organism → population → community → ecosystem → biome → biosphere", "Population → organism → ecosystem → community → biome", "Biosphere → biome → ecosystem → population → community", "Community → population → organism → ecosystem"], "a": 0, "e": "Each level adds scope: one organism, then its species, then all species, then the physical environment too."}, {"q": "All the sugar maples living in one forest constitute a:", "o": ["Community", "Population", "Ecosystem", "Biome"], "a": 1, "e": "A population is one species in one area; a community is all the interacting populations together."}, {"q": "A community consists of:", "o": ["One species only", "All the interacting populations in an area", "Living and nonliving components together", "The entire planet"], "a": 1, "e": "Adding the abiotic factors to a community gives you an ecosystem."}, {"q": "Which level of organization includes both biotic and abiotic components?", "o": ["Population", "Community", "Ecosystem", "Organism"], "a": 2, "e": "An ecosystem adds water, soil, sunlight, and temperature to the living community."}, {"q": "Which is an abiotic factor in a pond ecosystem?", "o": ["Algae", "Water temperature", "Frogs", "Bacteria"], "a": 1, "e": "Abiotic factors are nonliving: temperature, pH, dissolved oxygen, light penetration, and substrate."}, {"q": "A biome is defined primarily by its:", "o": ["Single dominant animal species", "Characteristic climate — temperature and precipitation — and the communities adapted to it", "Political boundaries", "Elevation alone"], "a": 1, "e": "Similar climates produce similar biomes on different continents, even with unrelated species."}, {"q": "Pennsylvania lies within which terrestrial biome?", "o": ["Tropical rainforest", "Temperate deciduous forest", "Tundra", "Desert"], "a": 1, "e": "Four distinct seasons, moderate precipitation, and broadleaf trees that drop their leaves each fall."}, {"q": "Freshwater and marine ecosystems are distinguished primarily by:", "o": ["Temperature", "Salinity", "Depth", "Sunlight"], "a": 1, "e": "Salt concentration is the defining abiotic difference and drives osmoregulation challenges for the organisms living there."}, {"q": "An estuary is characterized by:", "o": ["Constant high salinity", "Brackish water where fresh water meets salt water, with high productivity", "No living organisms", "Complete darkness"], "a": 1, "e": "Estuaries serve as nurseries for many marine species and act as natural filters."}, {"q": "A niche differs from a habitat because a niche is:", "o": ["The physical location where an organism lives", "The organism's full role — resources used, conditions tolerated, and interactions", "The organism's population size", "The same thing as a biome"], "a": 1, "e": "Habitat is the address; niche is the occupation."}];
BANK[26]=[{"q": "Organisms that manufacture their own food from inorganic sources are:", "o": ["Heterotrophs", "Autotrophs", "Decomposers", "Consumers"], "a": 1, "e": "Autotrophs, mostly photosynthetic, are the entry point of energy into nearly every ecosystem."}, {"q": "In a food chain, arrows point:", "o": ["From the consumer to what it eats", "In the direction energy flows, from the eaten to the eater", "In random directions", "Always toward the producer"], "a": 1, "e": "Grass → rabbit → hawk means energy moves from grass into the rabbit and then into the hawk."}, {"q": "Approximately what percentage of energy transfers from one trophic level to the next?", "o": ["1%", "10%", "50%", "90%"], "a": 1, "e": "The remaining ~90% is lost as heat and used in metabolism, which is why food chains rarely exceed four or five links."}, {"q": "If producers capture 10,000 kcal, roughly how much reaches secondary consumers?", "o": ["1,000 kcal", "100 kcal", "10 kcal", "5,000 kcal"], "a": 1, "e": "10,000 → 1,000 at primary consumers → 100 at secondary consumers."}, {"q": "An energy pyramid narrows toward the top because:", "o": ["Larger organisms need less space", "Energy is lost at each transfer, so less biomass can be supported at higher levels", "Predators reproduce faster", "Producers are counted twice"], "a": 1, "e": "The shape is a direct consequence of the 10% rule."}, {"q": "Decomposers are essential to an ecosystem because they:", "o": ["Produce oxygen", "Break down dead matter and return nutrients to the environment", "Occupy the top trophic level", "Perform photosynthesis"], "a": 1, "e": "Without decomposition, nutrients would stay locked in dead tissue and every cycle would stall."}, {"q": "An organism that eats both plants and animals is a:", "o": ["Herbivore", "Carnivore", "Omnivore", "Producer"], "a": 2, "e": "Omnivores occupy more than one trophic level, which is why food webs represent reality better than food chains."}, {"q": "A food web differs from a food chain because a food web:", "o": ["Contains only producers", "Shows interconnected feeding relationships with multiple pathways", "Excludes decomposers", "Is identical to a food chain"], "a": 1, "e": "Most organisms eat and are eaten by several species, so removing one has effects that ripple."}, {"q": "Energy differs from matter in an ecosystem because energy:", "o": ["Cycles endlessly", "Flows one way and is ultimately lost as heat, requiring constant resupply", "Is created by producers", "Never changes form"], "a": 1, "e": "Matter cycles through biogeochemical loops; energy makes a one-way trip from sun to heat."}, {"q": "A deep-sea vent community's producers obtain energy from:", "o": ["Sunlight", "Chemical compounds such as hydrogen sulfide, through chemosynthesis", "Decomposing whales only", "Geothermal heat directly as food"], "a": 1, "e": "Chemosynthesis shows that photosynthesis is not the only entry point for energy into a food web."}];
BANK[27]=[{"q": "Producing one Calorie of beef generally requires far more crop energy than producing one Calorie of beans because:", "o": ["Cattle are larger animals", "Roughly 90% of energy is lost between trophic levels, and beef adds a level", "Beans grow underground", "Beef contains no energy"], "a": 1, "e": "This is the 10% rule applied to agriculture — the central quantitative idea of the food-systems unit."}, {"q": "When you eat a plant, you are acting as a:", "o": ["Producer", "Primary consumer", "Secondary consumer", "Decomposer"], "a": 1, "e": "Eating an animal that ate a plant makes you a secondary consumer, one level further from the original captured energy."}, {"q": "If a crop delivers 10,000 kcal and is fed to livestock, roughly how much reaches a human eating that livestock?", "o": ["10,000 kcal", "1,000 kcal", "100 kcal", "5,000 kcal"], "a": 1, "e": "One transfer at about 10% efficiency. Eating the crop directly would deliver close to the full 10,000."}, {"q": "'Feed conversion ratio' measures:", "o": ["The number of animals per farm", "The mass of feed required per unit of animal product produced", "The price of meat", "The land area of a farm"], "a": 1, "e": "Ratios differ sharply by animal — poultry and fish convert far more efficiently than cattle, so 'meat' is not one category."}, {"q": "A common complication when comparing the land footprint of diets is that some grazing land:", "o": ["Is identical to cropland in every way", "Is not arable and could not grow human food crops anyway", "Produces no animal products", "Has no vegetation"], "a": 1, "e": "Marginal rangeland converts otherwise unusable vegetation into food, which is a genuine argument against a purely trophic comparison."}, {"q": "Livestock also affect the food system through greenhouse gases, most notably:", "o": ["Ozone from poultry", "Methane from ruminant digestion and manure", "Helium from grazing", "Neon from feedlots"], "a": 1, "e": "Methane traps considerably more heat per molecule than CO₂ over a short horizon, which is why ruminants draw specific attention."}, {"q": "Reducing food waste improves the efficiency of a food system because wasted food:", "o": ["Can be eaten later", "Has already consumed land, water, energy, and fertilizer that produced nothing", "Returns all its energy to the soil", "Is not part of the system"], "a": 1, "e": "Roughly a third of food produced globally is never eaten, making waste one of the largest available efficiency gains."}, {"q": "Aquaculture and poultry generally have lower land footprints per Calorie than beef largely because they:", "o": ["Are not animals", "Convert feed to body mass more efficiently and are not ruminants", "Require no feed at all", "Are grown hydroponically"], "a": 1, "e": "Efficiency varies within the animal category as much as between plants and animals."}, {"q": "Which statement best reflects the trophic argument applied honestly?", "o": ["Everyone must stop eating meat immediately", "Shifting some Calories from higher to lower trophic levels reduces land and energy demand per Calorie delivered", "Meat has no environmental cost", "Plants require more land than animals"], "a": 1, "e": "The science establishes a trade-off and its magnitude; what to do about it involves values, economics, and culture as well."}, {"q": "Which additional data would most improve a land-use comparison between two diets?", "o": ["The color of the packaging", "Water use, fertilizer inputs, greenhouse gas emissions, and whether the land is arable", "The brand names involved", "Consumer preference surveys"], "a": 1, "e": "Evaluating a real system means tracking multiple criteria and trade-offs, not optimizing a single number."}];
BANK[28]=[{"q": "Carbon enters the living portion of the carbon cycle mainly through:", "o": ["Respiration", "Photosynthesis", "Combustion", "Erosion"], "a": 1, "e": "Producers fix atmospheric CO₂ into organic compounds; respiration and combustion return it."}, {"q": "Which process returns carbon to the atmosphere?", "o": ["Photosynthesis", "Cellular respiration and decomposition", "Nitrogen fixation", "Transpiration"], "a": 1, "e": "Respiration releases CO₂; photosynthesis is the process that removes it."}, {"q": "Burning fossil fuels affects the carbon cycle by:", "o": ["Removing CO₂ from the atmosphere", "Releasing carbon stored underground for millions of years into the atmosphere", "Halting photosynthesis", "Creating new carbon atoms"], "a": 1, "e": "It shifts carbon from a long-term reservoir into the atmosphere far faster than natural processes remove it."}, {"q": "Nitrogen fixation is the conversion of:", "o": ["Nitrates into nitrogen gas", "Atmospheric N₂ into ammonia or nitrates that plants can use", "Ammonia into protein", "Nitrogen into carbon"], "a": 1, "e": "Bacteria, many living in legume root nodules, do this because plants cannot use N₂ gas directly."}, {"q": "Denitrifying bacteria:", "o": ["Convert nitrogen gas into ammonia", "Return nitrogen compounds to the atmosphere as N₂", "Fix carbon", "Produce oxygen"], "a": 1, "e": "They complete the loop, returning nitrogen from soil back to the atmosphere."}, {"q": "The phosphorus cycle differs from the carbon and nitrogen cycles because phosphorus:", "o": ["Has no significant atmospheric phase", "Is not required by living things", "Cycles fastest of the three", "Occurs only in the ocean"], "a": 0, "e": "It weathers from rock into soil and water, which makes it a common limiting nutrient."}, {"q": "Transpiration in the water cycle refers to water:", "o": ["Falling as precipitation", "Evaporating from plant leaves", "Freezing into glaciers", "Flowing through groundwater"], "a": 1, "e": "Combined with surface evaporation it is often measured together as evapotranspiration."}, {"q": "Excess nitrogen and phosphorus running off farmland into a lake typically causes:", "o": ["Improved water clarity", "Eutrophication — algal blooms followed by oxygen depletion and fish kills", "Nitrogen fixation to cease", "Lower water temperature"], "a": 1, "e": "Algae bloom, then die, and their decomposition consumes the dissolved oxygen fish require. This is the classic 'interrupted cycle' consequence."}, {"q": "Decomposers contribute to nutrient cycles by:", "o": ["Fixing nitrogen only", "Breaking down organic matter and releasing nutrients back into soil, water, and air", "Producing sugars", "Storing carbon permanently"], "a": 1, "e": "They participate in the carbon, nitrogen, and phosphorus cycles alike."}, {"q": "Matter cycles rather than flowing one way because:", "o": ["Matter is destroyed and recreated", "Atoms are conserved and reused repeatedly by different organisms", "New matter arrives from the sun", "Decomposers manufacture matter"], "a": 1, "e": "The carbon atoms in your body have cycled through countless organisms before you."}];
BANK[29]=[{"q": "A watershed is best defined as:", "o": ["A structure that stores water", "All the land area that drains into a common body of water", "A single stream channel", "An underground aquifer"], "a": 1, "e": "Anything applied to land in the watershed — fertilizer, manure, road salt, sediment — can reach the receiving water."}, {"q": "Excess nitrogen and phosphorus running off farmland into a lake typically causes:", "o": ["Improved water clarity", "Eutrophication — algal blooms, then decomposition that depletes dissolved oxygen", "Nitrogen fixation to stop", "Permanently colder water"], "a": 1, "e": "The algae themselves aren't the killer; the bacteria decomposing them consume the oxygen fish require."}, {"q": "Riparian buffer strips reduce agricultural runoff because vegetation along a stream:", "o": ["Adds nutrients to the water", "Slows runoff, holds soil, and takes up nutrients before they reach the stream", "Increases the volume of runoff", "Raises water temperature"], "a": 1, "e": "A standard Pennsylvania conservation practice, and a cheap one relative to remediating the downstream water body."}, {"q": "Wetlands are valuable in an agricultural watershed largely because they:", "o": ["Eliminate all flooding permanently", "Filter pollutants, absorb floodwater, and provide habitat", "Contain no living organisms", "Increase nutrient runoff"], "a": 1, "e": "Draining a wetland for cropland removes all three services simultaneously."}, {"q": "No-till farming reduces environmental impact primarily by:", "o": ["Increasing the number of tractor passes", "Leaving soil and crop residue undisturbed, reducing erosion and retaining carbon", "Requiring more fertilizer", "Eliminating the need for seeds"], "a": 1, "e": "The trade-off is often greater reliance on herbicides, which is exactly the kind of tension solution design has to weigh."}, {"q": "Integrated pest management reduces environmental impact by:", "o": ["Applying maximum pesticide on a fixed schedule", "Combining biological controls, crop rotation, and monitoring so chemicals are used only when thresholds are crossed", "Removing all insects from a field", "Prohibiting farming"], "a": 1, "e": "Monitoring against an economic threshold avoids routine spraying and slows the evolution of pesticide resistance."}, {"q": "A drought-tolerant genetically modified crop is produced by:", "o": ["Selective breeding alone over centuries", "Inserting a specific gene, often using restriction enzymes and a vector, to confer the trait", "Exposing seeds to sunlight", "Changing the soil pH"], "a": 1, "e": "Genetic engineering targets a known gene directly; selective breeding shifts many genes indirectly over many generations."}, {"q": "A commonly raised concern about genetically modified crops is:", "o": ["They contain no DNA", "Possible gene flow to wild relatives and effects on non-target organisms", "They cannot be grown outdoors", "They produce no yield"], "a": 1, "e": "Evaluating the technology means weighing documented benefits against plausible risks, not declaring it simply safe or simply dangerous."}, {"q": "When evaluating competing solutions to a food-system problem, the strongest approach is to:", "o": ["Choose whichever is cheapest", "Compare them against prioritized criteria and explicit trade-offs, including environmental and social impacts", "Pick the newest technology", "Select the one with the best marketing"], "a": 1, "e": "This is the engineering-design standard the course applies: criteria, constraints, and trade-offs — not a single best answer."}, {"q": "A proposed solution reduces fertilizer runoff but raises food prices significantly. The best response is to:", "o": ["Reject it automatically", "Evaluate the trade-off explicitly, considering who bears the cost and whether the design can be refined", "Implement it without analysis", "Ignore the price effect"], "a": 1, "e": "Refining a solution after evaluating its trade-offs is part of the design process, not a sign the design failed."}];
BANK[31]=[{"q": "Mutualism is a relationship in which:", "o": ["Both species benefit", "One benefits and one is harmed", "One benefits and one is unaffected", "Both are harmed"], "a": 0, "e": "Bees and flowering plants both gain: food for one, pollination for the other."}, {"q": "Commensalism is best illustrated by:", "o": ["A tick feeding on a dog", "Barnacles riding on a whale without measurably affecting it", "Bees pollinating flowers", "A lion hunting a zebra"], "a": 1, "e": "One organism benefits while the other is essentially unaffected (+/0)."}, {"q": "Parasitism differs from predation because a parasite:", "o": ["Kills its host immediately", "Typically lives on or in the host and harms it gradually without killing it quickly", "Benefits the host", "Does not feed at all"], "a": 1, "e": "A dead host is a lost resource, so successful parasites tend toward chronic rather than instant harm."}, {"q": "Two species competing for the same limited resource will typically:", "o": ["Both increase in number", "Experience reduced growth, or one will be excluded or shift its niche", "Merge into one species", "Become mutualists immediately"], "a": 1, "e": "Competition is a (−/−) interaction and a powerful selective pressure toward niche differentiation."}, {"q": "Exponential population growth produces which curve?", "o": ["S-shaped", "J-shaped", "A straight line", "A bell curve"], "a": 1, "e": "It occurs under unlimited resources and cannot continue indefinitely in a real environment."}, {"q": "Logistic growth levels off at the:", "o": ["Biotic potential", "Carrying capacity", "Trophic level", "Fixed maximum lifespan"], "a": 1, "e": "Carrying capacity (K) is the maximum population the environment can sustain over the long term."}, {"q": "Which is a density-dependent limiting factor?", "o": ["A hurricane", "Disease transmission within a crowded population", "A wildfire", "An early frost"], "a": 1, "e": "Density-dependent factors intensify as population rises; natural disasters strike regardless of density."}, {"q": "Which is a density-independent limiting factor?", "o": ["Competition for food", "Predation pressure", "A severe flood", "Parasite transmission"], "a": 2, "e": "A flood kills roughly the same proportion whether the population is sparse or dense."}, {"q": "A population that repeatedly exceeds its carrying capacity is likely to experience:", "o": ["Continued exponential growth", "A crash as resources are depleted", "Permanent stability", "Immediate speciation"], "a": 1, "e": "Overshoot degrades the resource base, which can lower the carrying capacity itself."}, {"q": "Limiting factors can drive a species toward extinction when:", "o": ["The population is very large and widespread", "The population is small, localized, and unable to adapt or relocate fast enough", "Predators disappear entirely", "Resources become unlimited"], "a": 1, "e": "This is why small, isolated populations are prioritized in conservation planning."}];

ble ecosystem tend to:", "o": ["Cause wild swings in every population", "Maintain relatively consistent numbers and types of organisms", "Eliminate all competition", "Prevent any species from reproducing"], "a": 1, "e": "That relative stability is the claim STEELS asks students to evaluate — and changing conditions can push the system to a new state."}, {"q": "An invasive species often disrupts a community because it:", "o": ["Cannot reproduce in the new range", "Arrives without its natural predators, parasites, and competitors", "Always dies within a year", "Is genetically identical to a native species"], "a": 1, "e": "Zebra mussels, emerald ash borer, and spotted lanternfly all illustrate the pattern in Pennsylvania."}, {"q": "Resource partitioning allows similar species to coexist by:", "o": ["Eliminating one species", "Using the shared resource in different ways, places, or times", "Interbreeding", "Sharing a single nest"], "a": 1, "e": "Warblers feeding at different heights in the same tree is the textbook example."}, {"q": "An ecosystem that shifts to a persistently different community after a major disturbance demonstrates that:", "o": ["Ecosystems never change", "Changing conditions can produce a new ecosystem rather than a return to the original", "Disturbance has no effect", "Only the largest species matter"], "a": 1, "e": "Stability has limits; past a threshold, a system can reorganize into a different stable state."}];
BANK[33]=[{"q": "A generalist species is one that:", "o": ["Eats only one food and lives in one habitat", "Tolerates a broad range of conditions and uses many resources", "Is always endangered", "Cannot reproduce in cities"], "a": 1, "e": "Broad tolerance is exactly what pays off when humans reshape a landscape."}, {"q": "A specialist species is generally more vulnerable to habitat change because it:", "o": ["Reproduces too quickly", "Depends on a narrow range of conditions or resources that may disappear", "Has too much genetic variation", "Eats too many kinds of food"], "a": 1, "e": "Koalas and eucalyptus, or pandas and bamboo — specialization is efficient until the resource shifts."}, {"q": "Coyotes have expanded their range across North America largely because they:", "o": ["Were deliberately introduced everywhere by people", "Eat an extremely varied diet, adapt to human landscapes, and adjust their breeding", "Require untouched wilderness", "Have no predators anywhere"], "a": 1, "e": "Every one of those traits is a generalist trait, and human-altered landscapes reward them."}, {"q": "Mesopredator release describes what happens when:", "o": ["A top predator is removed and mid-sized predators increase", "All predators are removed at once", "Prey species go extinct", "Predators become herbivores"], "a": 1, "e": "Wolf extirpation across much of North America opened ecological space that coyotes moved into."}, {"q": "Which trait would you expect in a species thriving in suburban Pennsylvania?", "o": ["A narrow diet of one native plant", "Tolerance of human disturbance, a flexible diet, and a high reproductive rate", "Dependence on old-growth forest interior", "An inability to cross roads"], "a": 1, "e": "Raccoons, white-tailed deer, and Canada geese all fit the same profile as coyotes."}, {"q": "Habitat fragmentation tends to harm specialists more than generalists because fragmentation:", "o": ["Increases the size of continuous habitat", "Creates small patches with BANK[34]=[{"q": "Natural selection requires all of the following EXCEPT:", "o": ["Heritable variation within the population", "Production of more offspring than can survive", "Differential survival and reproduction", "Individuals altering their own genes in response to need"], "a": 3, "e": "Individuals cannot acquire traits because they need them; selection filters variation that already exists."}, {"q": "In evolutionary terms, fitness means:", "o": ["Physical strength", "Reproductive success — passing genes to the next generation", "Lifespan", "Body size"], "a": 1, "e": "An organism that lives long but never reproduces has a fitness of zero."}, {"q": "Which unit actually evolves?", "o": ["An individual organism", "A population over generations", "A single cell", "One chromosome"], "a": 1, "e": "An individual's alleles are fixed at conception; only a population's allele frequencies can shift."}, {"q": "Antibiotic resistance spreads through a bacterial population because antibiotics:", "o": ["Cause bacteria to mutate into resistant forms", "Select for resistant variants that already existed, which then reproduce", "Weaken all bacteria equally", "Are absorbed as nutrients"], "a": 1, "e": "The mutation arises randomly and beforehand; the antibiotic is the filter, not the cause."}, {"q": "Peppered moths shifted toward dark coloration during industrialization because:", "o": ["Soot stained the moths", "Dark moths were better camouflaged on darkened trees and survived predation more often", "Moths chose darker coloring", "Light moths migrated away"], "a": 1, "e": "Bird predation was the selective pressure; the environment determined which existing variant was favored."}, {"q": "Over generations, natural selection changes a population's gene pool by:", "o": ["Eliminating all variation immediately", "Increasing the frequency of alleles associated with higher reproductive success", "Creating new alleles directly", "Keeping allele frequencies constant"], "a": 1, "e": "This is BANK[35]=[{"q": "A human arm, a whale flipper, and a bat wing are:", "o": ["Analogous structures", "Homologous structures", "Vestigial structures", "Unrelated coincidences"], "a": 1, "e": "Same underlying bone arrangement, different functions — anatomical evidence of descent from a common ancestor."}, {"q": "A butterfly wing and a bird wing are:", "o": ["Homologous", "Analogous — same function, independent evolutionary origins", "Vestigial", "Identical in structure"], "a": 1, "e": "Analogous structures arise from convergent evolution under similar selective pressure, not shared ancestry."}, {"q": "Vestigial structures are:", "o": ["Newly evolved features", "Reduced remnants of structures that were functional in ancestors", "Found only in fossils", "Always harmful"], "a": 1, "e": "Whale pelvic bones and cave fish eye remnants are standard examples."}, {"q": "Fossils found in deeper undisturbed rock layers are generally:", "o": ["Younger than those above", "Older than those above", "The same age", "Always vertebrates"], "a": 1, "e": "Sedimentary layers accumulate over time, so depth correlates with age."}, {"q": "Comparing DNA sequences between species shows that:", "o": ["All species have identical DNA", "Greater sequence similarity indicates a more recent common ancestor", "DNA cannot indicate relatedness", "Only fossils reveal relationships"], "a": 1, "e": "This biochemical evidence independently confirms relationships first inferred from anatomy."}, {"q": "Similar early embryonic development across vertebrates is evidence of:", "o": ["Convergent evolution", "Shared ancestry and conserved developmental genes", "Identical adult forms", "No evolutionary relationship"], "a": 1, "e": "Features such as pharyngeal pouches appear in fish, chicken, and human embryos alike."}, {"q": "That nearly all organisms use the same genetic code to build proteins is evidence for:", "o": ["Independent origins of each species", "A single common ancestry for life on Earth", "The impossibility of mutation", "Spontaneous generation"], "a": 1, "e": "The universal genetic code is one of the six evidence categories the Keystone eligible content names."}, {"q": "On a cladogram, relatedness is determined by:", "o": ["Left-to-right position of the tips", "Shared branch points indicating common ancestors", "Body size", "Geographic origin"], "a": 1, "e": "Two species sharing a more recent branch point are more closely related, regardless of where they are drawn."}, {"q": "Which observation would most strongly challenge evolutionary theory?", "o": ["A newly discovered transitional fossil", "A mammal fossil found in Precambrian rock layers", "Antibiotic resistance emerging in bacteria", "Homologous limb structures"], "a": 1, "e": "Evolution predicts a specific order of appearance. That it could be falsified this way is what makes it a scientific theory."}, {"q": "Isolated islands often hold unique species most closely related to nearby mainland forms. This biogeographic pattern supports:", "o": ["Independent creation of each island species", "Colonization followed by divergence from a mainland ancestor", "Random species distribution", "Identical species everywhere"], "a": 1, "e": "Darwin's finches are the canonical case."}];
BANK[36]=[{"q": "A biological species is best defined as a group that:", "o": ["Looks alike", "Can interbreed in nature and produce fertile offspring", "Lives in the same area", "Shares one gene"], "a": 1, "e": "Fertile is the key word — a horse and donkey produce a sterile mule, so they remain separate species."}, {"q": "Geographic isolation contributes to speciation by:", "o": ["Increasing gene flow between populations", "Preventing gene flow, allowing the separated populations to diverge", "Causing immediate mutation", "Merging two species"], "a": 1, "e": "A canyon, river, or mountain range splits the gene pool and differences accumulate independently."}, {"q": "Genetic drift is:", "o": ["Selection favoring the fittest individuals", "A change in allele frequencies due to chance events", "Migration between populations", "Directed mutation"], "a": 1, "e": "Unlike selection, drift is random with respect to fitness — a favorable allele can be lost by bad luck."}, {"q": "Genetic drift has the greatest effect on:", "o": ["Very large populations", "Small populations", "Populations under strong selection only", "Populations with high immigration"], "a": 1, "e": "Chance events shift frequencies dramatically when only a few individuals carry each allele."}, {"q": "The founder effect occurs when:", "o": ["A large population migrates together", "A small group establishes a new population carrying only a subset of the original gene pool", "Selection removes an allele", "Mutation rates increase"], "a": 1, "e": "The new population's allele frequencies reflect the founders' sample rather than the source population."}, {"q": "A population bottleneck reduces genetic diversity because:", "o": ["Mutation stops", "A sharp population crash leaves only a small, unrepresentative sample of alleles", "Selection favors all alleles equally", "Migration increases"], "a": 1, "e": "Cheetahs show the long-term cost: reduced variation and limited capacity to adapt."}, {"q": "Migration (gene flow var MEM = {};
var STORE = (function(){
  var ok=false;
  try{ window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); ok=true; }catch(e){ ok=false; }
  return {
    persistent: ok,
    read: function(){
      try{ return ok ? JSON.parse(window.localStorage.getItem("hbio")||"null") : MEM.hbio||null; }
      catch(e){ return null; }
    },
    write: function(o){
      try{ if(ok) window.localStorage.setItem("hbio",JSON.stringify(o)); else MEM.hbio=o; }catch(e){ MEM.hbio=o; }
    },
    wipe: function(){ try{ if(ok) window.localStorage.removeItem("hbio"); }catch(e){} MEM.hbio=null; }
  };
})();

var S = STORE.read() || {xp:0, streak:0, lastDay:null, passed:{}, best:{}, missed:{}, badges:{}};
if(!S.missed) S.missed={};
if(!S.badges) S.badges={};
function save(){ STORE.write(S); }

/* ============================ helpers ============================ */
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayDiff(a,b){
  if(!a) return null;
  var pa=a.split("-"), pb=b.split("-");
  var da=new Date(pa[0],pa[1]-1,pa[2]), db=new Date(pb[0],pb[1]-1,pb[2]);
  return Math.round((db-da)/86400000);
}
function touchStreak(){
  var t=today(), d=dayDiff(S.lastDay,t);
  if(d===null) S.streak=1;
  else if(d===0){ /* same day, no change */ }
  else if(d===1) S.streak=(S.streak||0)+1;
  else S.streak=1;
  S.lastDay=t;
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function lvl(n){ for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].n===n) return LEVELS[i]; return null; }
function cleared(s,a,b){ for(var i=a;i<=b;i++) if(!s.passed[i]) return false; return true; }
function unlocked(n){ return n===1 || !!S.passed[n-1]; }
function nextUp(){ for(var i=1;i<=40;i++){ if(unlocked(i) && !S.passed[i]) return i; } return null; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============================ item drawing ======================== */
function missKey(L,i){ return L+":"+i; }
function drawItems(n){
  var L=lvl(n), out=[];
  if(!L.boss){
    var src=BANK[n]||[];
    for(var i=0;i<src.length;i++) out.push({lv:n, ix:i, item:src[i]});
    shuffle(out);
    return out.slice(0,CFG.itemsPerLevel);
  }
  // Boss: pool everything before this checkpoint, weight by past misses
  var pool=[];
  for(var L2=1;L2<n;L2++){
    var b=BANK[L2]; if(!b) continue;
    for(var j=0;j<b.length;j++){
      var w = 1 + (S.missed[missKey(L2,j)]||0)*3;   // missed items are up to 4x likelier
      for(var k=0;k<w;k++) pool.push({lv:L2, ix:j, item:b[j]});
    }
  }
  shuffle(pool);
  var used={};
  for(var p=0;p<pool.length && out.length<CFG.bossItems;p++){
    var id=missKey(pool[p].lv,pool[p].ix);
    if(used[id]) continue;
    used[id]=1; out.push(pool[p]);
  }
  return out;
}
function prepOptions(rec){
  var it=rec.item, opts=[];
  for(var i=0;i<it.o.length;i++) opts.push({t:it.o[i], correct:(i===it.a)});
  shuffle(opts);
  return opts;
}

/* ============================ backup ============================== */
/* Tier 1 durability: progress lives in localStorage, which survives
   restarts but not a browsing-data wipe or a move to another machine.
   Export writes a small JSON file; import restores or merges it. */
function exportProgress(){
  var payload={
    app:"honors-biology-mastery", v:2,
    exported:new Date().toISOString(),
    levelsCleared:Object.keys(S.passed||{}).length,
    state:S
  };
  try{
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    var d=new Date(), pad=function(x){return (x<10?"0":"")+x};
    a.href=url;
    a.download="biology-progress-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(err){
    alert("Couldn't create the export file in this browser. Try opening the app from a downloaded copy rather than a preview.");
  }
}
function importProgress(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    var p;
    try{ p=JSON.parse(r.result); }
    catch(err){ alert("That file isn't readable as progress data."); return; }
    var inc=(p && p.state) ? p.state : p;
    if(!inc || typeof inc!=="object" || !inc.passed){
      alert("That file doesn't look like a Honors Biology progress export."); return;
    }
    var mineCount=Object.keys(S.passed||{}).length;
    var theirCount=Object.keys(inc.passed||{}).length;
    var msg = mineCount
      ? "Import will MERGE with the progress already in this browser.\n\nHere now: "+mineCount+" levels cleared\nIn file: "+theirCount+" levels cleared\n\nThe better score is kept for each level. Continue?"
      : "Restore "+theirCount+" cleared levels from this file?";
    if(!confirm(msg)) return;
    // merge: union of cleared levels, best score per level, higher XP and streak
    var k;
    for(k in (inc.passed||{})) S.passed[k]=1;
    for(k in (inc.best||{})) if(!S.best[k] || inc.best[k]>S.best[k]) S.best[k]=inc.best[k];
    for(k in (inc.missed||{})) S.missed[k]=Math.max(S.missed[k]||0, inc.missed[k]);
    S.xp=Math.max(S.xp||0, inc.xp||0);
    S.streak=Math.max(S.streak||0, inc.streak||0);
    if(inc.lastDay && (!S.lastDay || inc.lastDay>S.lastDay)) S.lastDay=inc.lastDay;
    save();
    home();
    alert("Imported. "+Object.keys(S.passed).length+" levels now cleared.");
  };
  r.onerror=function(){ alert("Couldn't read that file."); };
  r.readAsText(file);
}

/* ============================ header ============================== */
function paintHeader(){
  var passedCount=Object.keys(S.passed).length;
  var earned=BADGES.filter(function(b){return b.test(S)}).length;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><div class="v cyto">'+passedCount+'<span style="font-size:13px;color:var(--ink-faint)">/40</span></div><div class="k">Levels cleared</div></div>'+
    '<div class="stat"><div class="v pink">'+S.xp.toLocaleString()+'</div><div class="k">XP</div></div>'+
    '<div class="stat"><div class="v amber">'+(S.streak||0)+'</div><div class="k">Day streak</div></div>'+
    '<div class="stat"><div class="v">'+earned+'</div><div class="k">Badges</div></div>';
  document.getElementById("xpfill").style.width = (passedCount/40*100)+"%";
  document.getElementById("note").innerHTML =
    (STORE.persistent
      ? "Progress saves automatically in this browser."
      : "Preview mode &mdash; progress will not be saved. Download the file and open it from disk to keep progress.")+
    '<br><a href="#" id="expLink">Export progress</a> &middot; '+
    '<a href="#" id="impLink">Import progress</a> &middot; '+
    '<a href="#" id="resetLink">Reset all progress</a>'+
    '<input type="file" id="impFile" accept="application/json,.json" style="display:none">';
  document.getElementById("expLink").onclick=function(e){ e.preventDefault(); exportProgress(); };
  document.getElementById("impLink").onclick=function(e){ e.preventDefault(); document.getElementById("impFile").click(); };
  document.getElementById("impFile").onchange=function(e){ importProgress(e.target.files[0]); };
  document.getElementById("resetLink").onclick=function(e){
    e.preventDefault();
    if(confirm("Erase all progress, XP, and badges? This cannot be undone.")){
      STORE.wipe(); S={xp:0,streak:0,lastDay:null,passed:{},best:{},missed:{},badges:{}}; save(); home();
    }
  };
}

/* ============================ home =============================== */
function home(){
  var r=document.getElementById("root"), h="", nx=nextUp();
  h+='<div class="view">';
  for(var u=0;u<UNITS.length;u++){
    var U=UNITS[u];
    h+='<section class="unit"><div class="unit-head"><span class="num">UNIT '+U.n+'</span><h2>'+U.t+'</h2><span class="mod">'+U.mod+'</span></div><div class="tray">';
    for(var i=0;i<LEVELS.length;i++){
      var L=LEVELS[i]; if(L.u!==U.n) continue;
      var un=unlocked(L.n), done=!!S.passed[L.n], isNext=(L.n===nx);
      var cls="slide"+(un?"":" locked")+(done?" done":"")+(L.boss?" boss":"")+(isNext?" next":"");
      var foot = done ? '<span class="score">CLEARED '+Math.round(S.best[L.n]*100)+'%</span>'
               : un ? '<span>'+(L.boss?"CHECKPOINT":"READY")+'</span>' : '<span>LOCKED</span>';
      h+='<button class="'+cls+'" '+(un?'data-go="'+L.n+'"':'disabled')+'>'+
           '<div><div class="code">'+(L.boss?"CHECKPOINT ":"LEVEL ")+String(L.n).padStart(2,"0")+'</div>'+
           '<div class="title">'+L.t+'</div>'+
           (L.s?'<div class="std">'+L.s+'</div>':'')+'</div>'+
           '<div class="foot">'+foot+'<span>'+(L.boss?CFG.bossItems:CFG.itemsPerLevel)+' Q</span></div></button>';
    }
    h+='</div></section>';
  }

  // badges
  h+='<div class="card"><div class="eyebrow">Collection</div><h3 class="vt">Badges</h3><div class="chips">';
  for(var b=0;b<BADGES.length;b++){
    var got=BADGES[b].test(S);
    h+='<span class="chip'+(got?" on":"")+'">'+(got?"&#9679; ":"&#9675; ")+BADGES[b].t+'</span>';
  }
  h+='</div></div>';

  // weak spots
  var tally={};
  for(var k in S.missed){ var L3=parseInt(k.split(":")[0],10); tally[L3]=(tally[L3]||0)+S.missed[k]; }
  var rows=Object.keys(tally).map(function(x){return {n:parseInt(x,10),c:tally[x]}}).sort(function(a,b){return b.c-a.c}).slice(0,5);
  h+='<div class="card"><div class="eyebrow">Diagnostic</div><h3 class="vt">Where you keep slipping</h3>';
  if(!rows.length){ h+='<p class="muted">Nothing logged yet. Missed questions get tracked here and show up more often on checkpoints.</p>'; }
  else{
    h+='<ul class="weak">';
    for(var q=0;q<rows.length;q++) h+='<li><b>'+lvl(rows[q].n).t+'</b> &mdash; '+rows[q].c+' missed</li>';
    h+='</ul>';
  }
  h+='</div></div>';
  r.innerHTML=h;
  var btns=r.querySelectorAll("[data-go]");
  for(var z=0;z<btns.length;z++) btns[z].onclick=function(){ intro(parseInt(this.getAttribute("data-go"),10)); };
  paintHeader();
  window.scrollTo(0,0);
}

/* ============================ level intro ======================== */
function intro(n){
  var L=lvl(n), r=document.getElementById("root");
  var count = L.boss?CFG.bossItems:CFG.itemsPerLevel;
  var need = Math.ceil(count*CFG.passPct);
  r.innerHTML='<div class="view"><div class="card">'+
    '<div class="eyebrow">'+(L.boss?"Checkpoint ":"Level ")+String(n).padStart(2,"0")+
      (L.boss?"":" &middot; Unit "+L.u)+'</div>'+
    '<h3 class="vt">'+L.t+'</h3>'+
    '<p class="brief">'+L.b+'</p>'+
    '<p class="muted" style="margin-top:16px">'+count+' questions &middot; '+need+' correct to clear'+
      (S.passed[n]?' &middot; best so far '+Math.round(S.best[n]*100)+'%':'')+'</p>'+
    (L.s?'<div class="std">Aligned to '+L.s+'</div>':'')+
    '<div class="btnrow"><button class="btn" id="start">Start</button>'+
    '<button class="btn ghost" id="back">Back to levels</button></div></div></div>';
  document.getElementById("start").onclick=function(){ runQuiz(n); };
  document.getElementById("back").onclick=home;
  window.scrollTo(0,0);
}

/* ============================ quiz =============================== */
var Q = null;
function runQuiz(n){
  var recs=drawItems(n);
  Q = {n:n, recs:recs, opts:recs.map(prepOptions), pick:recs.map(function(){return -1}), i:0};
  paintQ();
}
function paintQ(){
  var r=document.getElementById("root"), L=lvl(Q.n), rec=Q.recs[Q.i], opts=Q.opts[Q.i];
  var pips="";
  for(var p=0;p<Q.recs.length;p++)
    pips+='<span class="pip'+(p===Q.i?" here":(Q.pick[p]>-1?" filled":""))+'"></span>';
  var letters=["A","B","C","D"];
  var oh="";
  for(var i=0;i<opts.length;i++)
    oh+='<button class="opt'+(Q.pick[Q.i]===i?" sel":"")+'" data-p="'+i+'"><span class="ltr">'+letters[i]+'</span><span>'+esc(opts[i].t)+'</span></button>';
  var last=(Q.i===Q.recs.length-1);
  r.innerHTML='<div class="view"><div class="card">'+
    '<div class="qmeta"><span>'+(L.boss?"CHECKPOINT ":"LEVEL ")+String(Q.n).padStart(2,"0")+
      (L.boss && rec.lv!==Q.n ? ' &middot; FROM LEVEL '+String(rec.lv).padStart(2,"0") : '')+
      '</span><span>'+(Q.i+1)+' / '+Q.recs.length+'</span></div>'+
    '<div class="pips">'+pips+'</div>'+
    '<p class="qtext" style="margin-top:18px">'+esc(rec.item.q)+'</p>'+
    '<div class="opts">'+oh+'</div>'+
    '<div class="btnrow">'+
      (Q.i>0?'<button class="btn ghost" id="prev">Back</button>':'')+
      '<button class="btn" id="next" '+(Q.pick[Q.i]<0?"disabled":"")+'>'+(last?"Submit answers":"Next")+'</button>'+
      '<button class="btn ghost" id="quit">Leave level</button>'+
    '</div></div></div>';
  var os=r.querySelectorAll(".opt");
  for(var z=0;z<os.length;z++) os[z].onclick=function(){ Q.pick[Q.i]=parseInt(this.getAttribute("data-p"),10); paintQ(); };
  if(document.getElementById("prev")) document.getElementById("prev").onclick=function(){ Q.i--; paintQ(); };
  document.getElementById("quit").onclick=function(){ if(confirm("Leave this level? This attempt won't count.")) home(); };
  document.getElementById("next").onclick=function(){
    if(Q.pick[Q.i]<0) return;
    if(last) grade(); else { Q.i++; paintQ(); }
  };
  window.scrollTo(0,0);
}

/* ============================ grading ============================ */
function grade(){
  var L=lvl(Q.n), right=0, wrongIdx=[];
  for(var i=0;i<Q.recs.length;i++){
    var chosen=Q.opts[i][Q.pick[i]];
    if(chosen && chosen.correct){ right++; }
    else{
      wrongIdx.push(i);
      var k=missKey(Q.recs[i].lv, Q.recs[i].ix);
      S.missed[k]=(S.missed[k]||0)+1;
    }
  }
  var pct=right/Q.recs.length, need=Math.ceil(Q.recs.length*CFG.passPct), pass=(right>=need);
  touchStreak();
  var firstClear = pass && !S.passed[Q.n];
  if(pass){
    var base = L.boss?CFG.xpBoss:CFG.xpBase;
    var gain = firstClear ? Math.round(base*(1+(pct===1?0.5:0))) : Math.round(base*0.25);
    S.xp += gain;
    S.passed[Q.n]=1;
    if(!S.best[Q.n] || pct>S.best[Q.n]) S.best[Q.n]=pct;
    Q.gain=gain;
    // clear miss weight for items answered correctly this run
    for(var c=0;c<Q.recs.length;c++){
      if(wrongIdx.indexOf(c)===-1){
        var kk=missKey(Q.recs[c].lv,Q.recs[c].ix);
        if(S.missed[kk]) S.missed[kk]=Math.max(0,S.missed[kk]-1);
        if(!S.missed[kk]) delete S.missed[kk];
      }
    }
  }
  save();
  results(right, pass, wrongIdx);
}

function itemHTML(i, showAll){
  var rec=Q.recs[i], opts=Q.opts[i], chosen=opts[Q.pick[i]], key=null;
  for(var z=0;z<opts.length;z++) if(opts[z].correct) key=opts[z].t;
  var ok = chosen && chosen.correct;
  if(!showAll && ok) return "";
  return '<div class="item">'+
    '<span class="tag '+(ok?"right":"wrong")+'">'+(ok?"Correct":"Missed")+' &middot; '+lvl(rec.lv).t+'</span>'+
    '<p class="q">'+esc(rec.item.q)+'</p>'+
    (ok?'':'<p class="ans you"><span class="k">You chose</span>'+esc(chosen?chosen.t:"nothing")+'</p>')+
    '<p class="ans key"><span class="k">Answer</span>'+esc(key)+'</p>'+
    '<p class="why">'+esc(rec.item.e)+'</p></div>';
}

function results(right, pass, wrongIdx){
  var r=document.getElementById("root"), L=lvl(Q.n), total=Q.recs.length;
  var need=Math.ceil(total*CFG.passPct);
  var h='<div class="view"><div class="card"><div class="verdict">'+
    '<p class="big '+(pass?"pass":"fail")+'">'+right+'/'+total+'</p>'+
    '<p class="lbl">'+(pass?"Level cleared &middot; +"+Q.gain+" XP":"Not yet &middot; "+need+" needed")+'</p></div>';

  if(pass){
    h+='<div class="btnrow" style="justify-content:center">'+
       '<button class="btn" id="cont">Continue</button>'+
       '<button class="btn ghost" id="rev">Review all '+total+' questions</button></div></div>';
    h+='<div class="card" id="revbox" style="display:none"><div class="eyebrow">Full review</div>';
    for(var i=0;i<total;i++) h+=itemHTML(i,true);
    h+='</div>';
  }else{
    h+='<div class="gate">Read through what you missed before retaking. The retake pulls fresh questions and shuffled answers.</div>';
    h+='</div><div class="card"><div class="eyebrow">'+wrongIdx.length+' to review</div><h3 class="vt">What went wrong</h3>';
    for(var j=0;j<total;j++) h+=itemHTML(j,false);
    h+='<div class="btnrow"><button class="btn" id="ack">I&rsquo;ve read these</button>'+
       '<button class="btn ghost" id="bail">Back to levels</button></div></div>';
    h+='<div class="card" id="retrybox" style="display:none"><div class="btnrow" style="margin-top:0">'+
       '<button class="btn" id="retry">Retake level '+String(Q.n).padStart(2,"0")+'</button>'+
       '<button class="btn ghost" id="bail2">Back to levels</button></div></div>';
  }
  h+='</div>';
  r.innerHTML=h;

  if(pass){
    document.getElementById("cont").onclick=function(){
      var nx=nextUp();
      if(nx) intro(nx); else home();
    };
    document.getElementById("rev").onclick=function(){
      var b=document.getElementById("revbox");
      b.style.display = b.style.display==="none" ? "block" : "none";
      if(b.style.display==="block") b.scrollIntoView({behavior:"smooth"});
    };
  }else{
    document.getElementById("ack").onclick=function(){
      document.getElementById("retrybox").style.display="block";
      this.disabled=true; this.textContent="Reviewed";
      document.getElementById("retrybox").scrollIntoView({behavior:"smooth"});
      document.getElementById("retry").onclick=function(){ runQuiz(Q.n); };
      document.getElementById("bail2").onclick=home;
    };
    document.getElementById("bail").onclick=home;
  }
  paintHeader();
  window.scrollTo(0,0);
}

home();



</script>
