<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honors Biology — Mastery Track</title>
<style>
:root{
  --glass:#F2EFF7;        /* slide glass — the page itself */
  --glass-2:#E7E2F0;      /* edge tint */
  --track:#D9D2E6;
  --page-ink:#241B3D;     /* type on the light page */
  --page-mute:#5E5678;
  --page-faint:#8A82A0;
  --eosin-ink:#B82A5D;    /* eosin, darkened for light backgrounds */
  --cyto-ink:#17836F;
  --amber-ink:#A96F10;
  --mount:#120E1B;        /* slide mount, deep violet-black */
  --panel:#1C1530;        /* stained field */
  --panel-2:#241B3D;
  --hema:#6B4BA8;         /* hematoxylin violet — structure, borders */
  --hema-dim:#3A2B5C;
  --eosin:#E0417B;        /* eosin pink — primary action */
  --cyto:#2FB8A0;         /* correct / alive */
  --amber:#F0A73A;        /* streaks, warnings */
  --ink:#EFE9F7;
  --ink-mute:#A79DBD;
  --ink-faint:#6F6689;
  --frost:#E8E3F2;        /* frosted label strip */
  --r:10px;
  --display:"Palatino Linotype","Book Antiqua",Palatino,Optima,Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono","Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 50% -12%, #FFFFFF 0%, transparent 62%),
    linear-gradient(180deg, var(--glass) 0%, var(--glass-2) 100%);
  background-attachment:fixed;
  color:var(--page-ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:1060px;margin:0 auto;padding:24px 18px 80px}
a{color:var(--eosin)}

/* ---------- header ---------- */
.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
  border-bottom:1px solid var(--track);
  padding-bottom:16px;margin-bottom:22px;
}
.brand h1{
  font-family:var(--display);color:var(--page-ink);
  font-size:30px;line-height:1.1;margin:0;font-weight:600;letter-spacing:.2px;
}
.brand .sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--page-faint);margin-top:7px;
}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{text-align:right}
.stat .v{font-family:var(--mono);font-size:21px;color:var(--page-ink);line-height:1}
.stat .v span{color:var(--page-faint)!important}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--page-faint);margin-top:5px}
.stat .v.pink{color:var(--eosin-ink)} .stat .v.amber{color:var(--amber-ink)} .stat .v.cyto{color:var(--cyto-ink)}

.xpbar{height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin:0 0 26px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin));width:0;transition:width .6s cubic-bezier(.2,.7,.3,1)}

/* ---------- unit + slide tray ---------- */
.unit{margin-bottom:34px}
.unit-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.unit-head .num{font-family:var(--mono);font-size:11px;color:var(--eosin-ink);letter-spacing:.16em}
.unit-head h2{font-family:var(--display);font-size:20px;margin:0;font-weight:600;color:var(--page-ink)}
.unit-head .mod{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--page-mute);border:1px solid var(--track);background:rgba(255,255,255,.55);
  padding:2px 7px;border-radius:99px;
}
.std{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--ink-faint);margin-top:7px;line-height:1.5}
.slide .std{margin-top:5px;font-size:9px}
.card .std{color:var(--ink-faint);border-top:1px solid var(--hema-dim);padding-top:11px;margin-top:15px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px}

/* the signature element: a microscope slide */
.slide{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:104px;padding:11px 12px 10px;
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  border:1px solid var(--hema-dim);border-radius:4px;
  border-left:7px solid var(--frost);
  cursor:pointer;text-align:left;color:var(--ink);font:inherit;
  box-shadow:0 2px 8px rgba(36,27,61,.16);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.slide:hover:not(.locked){transform:translateY(-2px);border-color:var(--hema);box-shadow:0 10px 24px rgba(36,27,61,.28)}
.slide:focus-visible{outline:2px solid var(--eosin);outline-offset:3px}
.slide .code{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-faint)}
.slide .title{font-size:13.5px;line-height:1.3;margin:6px 0 0;font-weight:600}
.slide .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint)}
.slide.locked{
  background:linear-gradient(160deg,#E4DFEF,#D7D0E7);
  border-color:var(--track);border-left-color:#CFC7E0;
  box-shadow:none;cursor:not-allowed;
}
.slide.locked .code,.slide.locked .foot{color:var(--page-faint)}
.slide.locked .title{color:var(--page-mute)}
.slide.done{border-left-color:var(--cyto)}
.slide.done .foot .score{color:var(--cyto)}
.slide.boss{border-left-color:var(--eosin);background:linear-gradient(160deg,#341A3A,#211231)}
.slide.boss .code{color:var(--eosin)}
.slide.next{border-color:var(--eosin)}
.slide.next::after{
  content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:99px;
  background:var(--eosin);box-shadow:0 0 0 0 rgba(224,65,123,.6);animation:pulse 2.2s infinite;
}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(224,65,123,0)}100%{box-shadow:0 0 0 0 rgba(224,65,123,0)}}

/* ---------- view: the field of view ---------- */
.view{animation:focusIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes focusIn{from{opacity:0;filter:blur(7px);transform:scale(.985)}to{opacity:1;filter:blur(0);transform:none}}
.card{
  background:linear-gradient(165deg,var(--panel-2),var(--panel));
  border:1px solid var(--hema-dim);border-radius:var(--r);padding:22px;margin-bottom:16px;
  color:var(--ink);box-shadow:0 4px 16px rgba(36,27,61,.18);
}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--eosin);margin-bottom:9px}
h3.vt{font-family:var(--display);font-size:23px;margin:0 0 10px;font-weight:600;line-height:1.2}
.brief{color:var(--ink-mute);font-size:15px;margin:0 0 4px}
.brief b{color:var(--ink);font-weight:600}

.btn{
  font:inherit;font-weight:600;font-size:14.5px;border:0;border-radius:7px;padding:11px 22px;
  background:var(--eosin);color:#fff;cursor:pointer;transition:filter .15s ease,transform .12s ease;
}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink-mute);border:1px solid var(--hema-dim)}
.btn.ghost:hover{color:var(--ink);border-color:var(--hema)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* ---------- quiz ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:14px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:20px;height:4px;border-radius:99px;background:var(--hema-dim)}
.pip.filled{background:var(--hema)}
.pip.here{background:var(--eosin)}
.qtext{font-size:18px;line-height:1.5;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;
  background:rgba(255,255,255,.03);border:1px solid var(--hema-dim);color:var(--ink);
  border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--hema);background:rgba(255,255,255,.06)}
.opt:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.opt.sel{border-color:var(--eosin);background:rgba(224,65,123,.13)}
.opt .ltr{font-family:var(--mono);font-size:12px;color:var(--ink-faint);padding-top:2px;min-width:14px}
.opt.sel .ltr{color:var(--eosin)}

/* ---------- results & review ---------- */
.verdict{text-align:center;padding:8px 0 4px}
.verdict .big{font-family:var(--display);font-size:52px;line-height:1;margin:0}
.verdict .big.pass{color:var(--cyto)} .verdict .big.fail{color:var(--eosin)}
.verdict .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:10px}
.gate{
  border:1px dashed var(--eosin);border-radius:8px;padding:13px 15px;margin-top:16px;
  font-size:14px;color:var(--ink-mute);background:rgba(224,65,123,.07);
}
.item{border-top:1px solid var(--hema-dim);padding:16px 0}
.item:first-child{border-top:0}
.item .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.tag.wrong{color:var(--eosin)} .tag.right{color:var(--cyto)}
.item .q{font-size:15.5px;margin:6px 0 9px}
.ans{font-size:14px;margin:3px 0}
.ans .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-right:7px}
.ans.you{color:#F2A0BE} .ans.key{color:var(--cyto)}
.why{font-size:14.5px;color:var(--ink-mute);margin-top:9px;padding-left:13px;border-left:2px solid var(--hema)}
.seen{margin-top:11px}

/* ---------- badges & weak spots ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:5px 11px;border-radius:99px;
  border:1px solid var(--hema-dim);color:var(--ink-mute);
}
.chip.on{border-color:var(--amber);color:var(--amber)}
.weak li{margin-bottom:5px;color:var(--ink-mute);font-size:14.5px}
.weak b{color:var(--ink)}
.muted{color:var(--ink-faint);font-size:13px}
.note{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--page-faint);text-align:center;margin-top:34px;line-height:1.7}
.note a{color:var(--page-faint);text-decoration:underline}
.note a:hover{color:var(--eosin-ink)}
@media (max-width:520px){
  .brand h1{font-size:24px}.verdict .big{font-size:42px}.wrap{padding:18px 14px 60px}
  .stats{gap:16px}.stat .v{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">
      <h1>Honors Biology</h1>
      <div class="sub">Honors Biology Syllabus &middot; PA STEELS &middot; 40 Levels</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="xpbar"><i id="xpfill"></i></div>
  <main id="root"></main>
  <div class="note" id="note"></div>
</div>
<script>


/* ============================================================
   HONORS BIOLOGY — MASTERY TRACK
   Structured to the Honors Biology course syllabus (Miller &
   Levine, Pearson 2019 + BSCS Biology: Understanding for Life,
   Kendall Hunt 2022). The four units follow the syllabus's own
   Course Content driving questions.

   Standards tags are PA STEELS (May 2023), which the Biology
   Keystone has been aligned to since May 2026.
   3.1 = Life Science, 3.2 = Physical Science,
   3.4 = Environmental Literacy & Sustainability,
   3.5 = Technology & Engineering.
   ============================================================ */

var CFG = {
  itemsPerLevel: 10,
  bossItems: 15,
  passPct: 0.80,
  xpBase: 100,
  xpBoss: 400
};

var LEVELS = [
  /* ---- UNIT 1 — infection, immune response, resistance ---- */
  {n:1,  u:1, s:"Science & Engineering Practices", t:"Science as a Way of Knowing", b:"Know the vocabulary precisely: an <b>observation</b> is what you record, an <b>inference</b> is what you conclude from it, a <b>hypothesis</b> is testable and falsifiable, a <b>theory</b> is a well-supported explanation of a broad phenomenon, and a <b>law</b> describes what happens without explaining why. An experiment changes one <b>independent variable</b>, holds <b>constants</b> fixed, and compares against a <b>control</b>."},
  {n:2,  u:1, s:"Analyzing & Interpreting Data", t:"Data, Graphs & Measurement", b:"Independent variable on the x-axis, dependent on the y. Line graphs for continuous change, bar graphs for separate categories. Repeated trials reduce random error; a miscalibrated instrument produces systematic error that repeating won't fix. Correlation is not causation."},
  {n:3,  u:1, s:"3.2.9-12.A · 3.2.9-12.B", t:"Atoms, Bonding & the Chemistry of Water", b:"<b>Valence electrons</b> determine bonding. Covalent bonds share electrons; ionic bonds transfer them; unequal sharing between atoms of different <b>electronegativity</b> makes a bond polar. Water's polarity gives it cohesion, adhesion, high specific heat, and its power as a solvent. pH below 7 is acidic; the scale is logarithmic."},
  {n:4,  u:1, s:"3.1.9-12.B · Driving Q1", t:"Bacteria vs. Your Cells: How Infection Starts", b:"<b>Prokaryotes</b> — bacteria — have no nucleus and no membrane-bound organelles, a circular chromosome, and a peptidoglycan wall. <b>Eukaryotes</b> have a true nucleus and compartmentalized organelles. That wall is the difference antibiotics exploit. Bacteria cause disease by multiplying fast, damaging tissue directly, or releasing toxins."},
  {n:5,  u:1, s:"3.1.9-12.A · 3.1.9-12.B", t:"Organelles, Structure & Function", b:"Form determines function at every level. Nucleus stores DNA; ribosomes build protein; rough ER folds and ships it; Golgi modifies and packages; lysosomes digest — including bacteria a white blood cell has swallowed. Mitochondria and chloroplasts have double membranes and their own DNA, the evidence for <b>endosymbiosis</b>."},
  {n:6,  u:1, s:"3.1.9-12.B · Driving Q1", t:"Membranes & Transport", b:"The <b>fluid mosaic</b> model: a phospholipid bilayer studded with proteins. Small nonpolar molecules cross freely; ions and large polar molecules need channels. <b>Passive</b> transport (diffusion, osmosis, facilitated diffusion) runs down the gradient for free; <b>active</b> transport pumps against it using ATP. Endocytosis and exocytosis move material in bulk."},
  {n:7,  u:1, s:"3.2.9-12.E · 3.1.9-12.A", t:"Enzymes, Reaction Rates & How Antibiotics Work", b:"Enzymes are protein catalysts that lower <b>activation energy</b>; specificity comes from active-site shape. Rate rises with temperature until the protein <b>denatures</b>, and each enzyme has an optimal pH. Many antibiotics are enzyme inhibitors — penicillin blocks the enzyme that cross-links bacterial cell wall, which is why it harms bacteria and not you."},
  {n:8,  u:1, s:"3.1.9-12.C · Driving Q2", t:"Homeostasis, Feedback & Fighting Infection", b:"Homeostasis is a stable internal environment maintained by <b>feedback</b>. Negative feedback reverses a change — thermoregulation, blood glucose, water balance. Positive feedback amplifies toward an endpoint, as in clotting and childbirth. Your response to infection runs both: innate defenses (barriers, inflammation, fever, phagocytes) act immediately; adaptive immunity builds specific antibodies and memory."},
  {n:9,  u:1, s:"3.1.9-12.T · 3.1.9-12.U · Driving Q3", t:"Antibiotic Resistance: Selection You Can Watch", b:"Resistance is <b>not</b> the antibiotic causing mutation. Resistant variants already exist by chance; the antibiotic kills the susceptible ones and the survivors reproduce. Short generation times, huge populations, horizontal gene transfer by plasmid, incomplete courses, and agricultural use all accelerate it. This is natural selection on a timescale you can measure in days."},
  {n:10, u:1, s:"Cumulative — Unit 1", t:"Checkpoint: Infection & Resistance", boss:true, b:"Cumulative on Unit 1. Items are drawn from every level cleared so far, weighted toward the ones you've missed."},

  /* ---- UNIT 2 — cholesterol, genetics, complex disease ---- */
  {n:11, u:2, s:"3.1.9-12.F", t:"Carbon & Building Macromolecules", b:"Carbon forms four covalent bonds, so it builds chains, branches, and rings no other element can. <b>Dehydration synthesis</b> joins monomers and releases water; <b>hydrolysis</b> adds water to split a polymer. Carbon, hydrogen, and oxygen from sugar are recombined with nitrogen and other elements to build amino acids, lipids, and nucleic acids."},
  {n:12, u:2, s:"3.1.9-12.F · Driving Q4", t:"Carbohydrates, Lipids & Cholesterol", b:"Carbohydrates are C, H, O in roughly 1:2:1. Lipids are nonpolar, energy-dense, and build membranes. <b>Cholesterol</b> is a steroid your liver makes and your membranes require — it isn't a poison. Trouble comes from transport: <b>LDL</b> deposits cholesterol in artery walls, <b>HDL</b> carries it back to the liver. Saturated and trans fats raise LDL; unsaturated fats generally don't."},
  {n:13, u:2, s:"3.1.9-12.A · 3.1.9-12.F", t:"Proteins & Nucleic Acids", b:"Proteins are amino acid chains joined by peptide bonds; the folded 3-D shape determines function, and the R groups determine the fold. Nucleic acids are chains of nucleotides — sugar, phosphate, nitrogen base. DNA stores the information, RNA carries and translates it."},
  {n:14, u:2, s:"3.1.9-12.P · 3.1.9-12.Q", t:"DNA Structure & Replication", b:"An antiparallel double helix held across the middle by <b>hydrogen bonds</b>: A–T with two, C–G with three. Replication is <b>semiconservative</b> — helicase unzips, polymerase builds 5'→3' and proofreads, ligase seals. Errors that escape proofreading become heritable variation."},
  {n:15, u:2, s:"3.1.9-12.A", t:"Transcription, Translation & Gene Expression", b:"DNA → mRNA → protein. RNA uses uracil and ribose and is single-stranded. Codons are three bases; tRNA anticodons deliver amino acids. The code is essentially <b>universal</b>. Every cell shares one genome — differentiation is a matter of which genes are switched on."},
  {n:16, u:2, s:"3.1.9-12.Q", t:"Mutations & Genetic Variation", b:"A <b>silent</b> substitution changes no amino acid; <b>missense</b> swaps one; <b>nonsense</b> creates a premature stop; an insertion or deletion causes a <b>frameshift</b> that garbles everything downstream. Heritable variation arises three ways: new combinations through meiosis, viable replication errors, and mutations caused by environmental agents."},
  {n:17, u:2, s:"3.1.9-12.D", t:"Cell Cycle, Mitosis & Differentiation", b:"Interphase (G1, S, G2) is most of the cycle; DNA replicates in S. Mitosis runs prophase → metaphase → anaphase → telophase, then cytokinesis, yielding two identical diploid cells. Division plus <b>differentiation</b> is how one zygote becomes a body of specialized tissues. When checkpoint genes fail, division goes uncontrolled."},
  {n:18, u:2, s:"3.1.9-12.Q", t:"Meiosis & the Sources of Variation", b:"Meiosis halves chromosome number: one diploid cell → four genetically distinct haploid gametes. Meiosis I separates <b>homologous pairs</b>; meiosis II separates sister chromatids. Variation comes from crossing over, independent assortment, and random fertilization. <b>Nondisjunction</b> changes chromosome count."},
  {n:19, u:2, s:"3.1.9-12.P · 3.1.9-12.R · Driving Q5 & Q6", t:"Inheritance, Complex Traits & Disease Risk", b:"Mendel's laws still hold: <b>segregation</b> and <b>independent assortment</b>, with Aa × Aa giving 3:1. But heart disease isn't one gene. Most traits that matter clinically are <b>polygenic</b> and <b>multifactorial</b> — many genes of small effect, interacting with diet, exercise, and smoking. Familial hypercholesterolemia is the rare single-gene exception. Risk is a probability, not a verdict."},
  {n:20, u:2, s:"Cumulative — Units 1–2", t:"Checkpoint: Molecules, Genes & Risk", boss:true, b:"Cumulative on Units 1–2. Weighted toward items you've missed."},

  /* ---- UNIT 3 — food, energy, and food systems ---- */
  {n:21, u:3, s:"3.1.9-12.F · 3.1.9-12.G · Driving Q7", t:"What We Need From Food", b:"Food supplies two distinct things: <b>energy</b> (from carbohydrates, lipids, and protein) and <b>raw materials</b> your body cannot synthesize — essential amino acids, essential fatty acids, vitamins, and minerals. Digestion is hydrolysis, breaking polymers into absorbable monomers. Macronutrients are needed in bulk; micronutrients in trace amounts, but a deficiency is still disabling."},
  {n:22, u:3, s:"3.1.9-12.E · 3.1.9-12.G", t:"ATP, Mitochondria & Chloroplasts", b:"<b>ATP</b> is the cell's immediate energy currency: adenine, ribose, three phosphates. Breaking the terminal phosphate bond releases usable energy and leaves ADP. Mitochondria regenerate ATP; chloroplasts capture light. Both maximize internal membrane surface area to do it."},
  {n:23, u:3, s:"3.1.9-12.E", t:"Photosynthesis", b:"6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂. Light reactions in the thylakoid split water, release O₂, and make ATP and NADPH. The Calvin cycle in the stroma spends them to fix CO₂ into sugar. Light energy is transformed into chemical bond energy — not created."},
  {n:24, u:3, s:"3.1.9-12.G · 3.1.9-12.J", t:"Cellular Respiration & Fermentation", b:"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ~36 ATP. Glycolysis (cytoplasm) → Krebs cycle (matrix) → electron transport chain, where oxygen is the final electron acceptor. Bonds in food and oxygen are broken and new bonds formed, netting a transfer of energy. Without O₂, fermentation regenerates NAD⁺ for a net 2 ATP."},
  {n:25, u:3, s:"3.1.9-12.I", t:"Ecological Organization & Ecosystems", b:"Organism → population → community → ecosystem → biome → biosphere. An ecosystem adds <b>abiotic</b> factors — water, light, soil, temperature — to the biotic community. Biomes are defined by climate. Aquatic ecosystems divide chiefly by salinity, with estuaries in between. Habitat is the address; niche is the occupation."},
  {n:26, u:3, s:"3.1.9-12.H", t:"Energy Flow & the 10% Rule", b:"Producers capture energy; roughly <b>10%</b> transfers to each successive trophic level, the rest lost as heat and metabolism. That single number explains why food chains are short and why energy pyramids narrow. Arrows point the way energy moves. Energy flows one way; matter cycles."},
  {n:27, u:3, s:"3.1.9-12.H · 3.4.9-12.A · Driving Q8", t:"Why Some Diets Need More Land", b:"Apply the 10% rule to agriculture. Eating a plant puts you at the second trophic level; eating an animal that ate the plant puts you at the third, so roughly ten times the crop energy is required per Calorie delivered. That is why beef needs far more land and water per Calorie than beans. Grazing on non-arable land and by-product feed complicate the arithmetic, but the trophic penalty is real."},
  {n:28, u:3, s:"3.1.9-12.J · 3.1.9-12.K", t:"Cycling of Matter", b:"Carbon moves via photosynthesis, respiration, decomposition, and combustion, cycling among biosphere, atmosphere, hydrosphere, and geosphere. Nitrogen must be <b>fixed</b> by bacteria before plants can use it. Phosphorus has no significant atmospheric stage. Matter is conserved and reused; energy is not."},
  {n:29, u:3, s:"3.4.9-12.A · 3.4.9-12.C · 3.5.9-12.I · Driving Q9", t:"Agriculture, Watersheds & Designing Solutions", b:"Nutrient runoff drives <b>eutrophication</b> — algal bloom, then decomposition, then oxygen depletion and fish kill. A <b>watershed</b> is all land draining to a common body of water; vegetation slows runoff, impervious surfaces speed it, wetlands filter it. Solutions — buffer strips, no-till, integrated pest management, drought-tolerant GMOs, reduced food waste — are evaluated on trade-offs, not perfection."},
  {n:30, u:3, s:"Cumulative — Unit 3", t:"Checkpoint: Food, Energy & Systems", boss:true, b:"Cumulative on Unit 3 plus carryover from Units 1–2. Weighted toward items you've missed."},

  /* ---- UNIT 4 — biodiversity and the sixth extinction ---- */
  {n:31, u:4, s:"3.1.9-12.I · 3.1.9-12.L", t:"Populations, Limiting Factors & Carrying Capacity", b:"Exponential growth is J-shaped; logistic growth is S-shaped and levels at <b>carrying capacity</b>. Density-dependent factors such as disease and competition intensify as a population grows; density-independent factors such as a flood do not. Carrying capacity is set by whichever resource is in shortest supply."},
  {n:32, u:4, s:"3.1.9-12.M", t:"Species Interactions & Community Dynamics", b:"Competition (−/−), predation (+/−), mutualism (+/+), commensalism (+/0), parasitism (+/−). Complex interactions tend to hold numbers relatively steady, but a <b>keystone species</b> has effects far out of proportion to its abundance, and removing one can cascade through the whole community and produce a different ecosystem."},
  {n:33, u:4, s:"3.1.9-12.W · 3.1.9-12.X · Driving Q10", t:"Generalists vs. Specialists: Why Coyotes Expand", b:"A <b>generalist</b> tolerates a broad range of conditions and eats a wide diet; a <b>specialist</b> is finely adapted to a narrow niche. Human-altered landscapes reward generalists and punish specialists. Coyotes expanded because they eat almost anything, breed flexibly, and moved into the niche left by extirpated wolves — <b>mesopredator release</b>. The same changes that expand raccoons and deer contract specialists."},
  {n:34, u:4, s:"3.1.9-12.T · 3.1.9-12.U · 3.1.9-12.W", t:"Natural Selection & Adaptation", b:"Evolution results primarily from four factors: potential to increase in number, heritable variation from mutation and sexual reproduction, competition for limited resources, and the proliferation of those better able to survive and reproduce. <b>Populations evolve; individuals do not.</b> Fitness means reproductive success. Favored alleles rise in proportion over generations."},
  {n:35, u:4, s:"3.1.9-12.S", t:"Evidence of Common Ancestry", b:"Multiple independent lines converge: <b>fossil</b>, <b>anatomical</b> (homologous, analogous, vestigial), <b>embryological</b>, <b>biochemical</b>, and the <b>universal genetic code</b>. The more DNA two species share, the more recent their common ancestor. On a cladogram, branch points show relatedness — not where a tip sits on the page."},
  {n:36, u:4, s:"3.1.9-12.X", t:"Speciation, Drift & the History of Life", b:"Species split when gene flow stops — geographic or reproductive isolation. <b>Genetic drift</b> shifts allele frequencies by chance and hits small populations hardest; the <b>founder effect</b> and bottlenecks are special cases. Environmental change can increase some species, produce new ones, and drive others extinct — all three at once."},
  {n:37, u:4, s:"3.1.9-12.O", t:"Group Behavior & Survival", b:"Living in groups carries real costs — competition for food, faster disease spread, conspicuousness to predators — so it persists only where benefits exceed them. Benefits include shared vigilance, cooperative hunting, the dilution effect, thermoregulation, and cooperative care of young. Evaluate the claim with evidence: does group living raise individual survival and reproduction, or not?"},
  {n:38, u:4, s:"3.1.9-12.X · 3.1.9-12.L · Driving Q11", t:"The Sixth Mass Extinction", b:"Five mass extinctions appear in the fossil record; scientists argue a sixth is underway because current rates run far above the <b>background extinction rate</b> and the cause is a single species. The drivers, roughly in order: <b>H</b>abitat loss, <b>I</b>nvasive species, <b>P</b>ollution, <b>P</b>opulation and overharvest, <b>C</b>limate change. Unlike an asteroid, this one is diagnosable in advance."},
  {n:39, u:4, s:"3.1.9-12.M · 3.1.9-12.N · 3.1.9-12.V · Driving Q12", t:"Biodiversity, Ecosystem Services & Solutions", b:"Biodiversity spans genetic, species, and ecosystem levels. Diverse systems carry <b>redundancy</b>, so losing one species is absorbed rather than cascading. <b>Ecosystem services</b> — pollination, water filtration, carbon storage, soil formation, disease regulation — are what biodiversity delivers to people. Solutions get evaluated on cost, trade-offs, and evidence: corridors, protected areas, restoration, invasive control."},
  {n:40, u:4, s:"Cumulative — entire course", t:"Final Checkpoint: Whole Course", boss:true, b:"Cumulative across all 39 levels, weighted hard toward everything you've ever missed. The closest thing here to the real end-of-course Keystone."}
];

BANK[1]=[{"q": "Which statement is an inference rather than an observation?", "o": ["The leaf is 12 cm long", "The leaf has brown spots on its surface", "The leaf turned brown because of a fungal infection", "The leaf weighs 2.1 g"], "a": 2, "e": "An observation is recorded directly with the senses or an instrument. An inference is an explanation you reason to from observations — the cause was not observed."}, {"q": "In science, a theory is best described as:", "o": ["An untested guess", "A well-supported explanation for a broad range of observations", "A rule that describes what happens without explaining why", "A single confirmed fact"], "a": 1, "e": "Theories are the most robust explanations science produces. The everyday use of 'theory' to mean a hunch is the opposite of the scientific meaning."}, {"q": "A scientific law differs from a theory because a law:", "o": ["Describes what happens under given conditions without explaining why", "Explains the underlying mechanism", "Cannot be tested", "Is a theory that has been proven"], "a": 0, "e": "Laws describe, theories explain. A theory does not 'graduate' into a law — they answer different questions."}, {"q": "Which is a testable hypothesis?", "o": ["Plants are interesting to study", "Fertilizer is beneficial", "If tomato plants receive fertilizer, then they will grow taller than plants without it", "Why do plants need nitrogen?"], "a": 2, "e": "A hypothesis must be a falsifiable statement predicting a measurable outcome — not a question or a value judgment."}, {"q": "A student tests whether fertilizer amount affects plant height. The independent variable is:", "o": ["Plant height", "Amount of fertilizer", "Type of soil", "Hours of sunlight"], "a": 1, "e": "The independent variable is what the experimenter deliberately changes. Height is measured in response, so it is dependent."}, {"q": "In that same experiment, the control group is the plants that receive:", "o": ["The most fertilizer", "No fertilizer", "Half the fertilizer", "No water"], "a": 1, "e": "The control receives no treatment, providing the baseline every treated group is compared against."}, {"q": "Constants (controlled variables) are the factors that are:", "o": ["Deliberately changed", "Kept identical across all groups", "Measured as results", "Concluded at the end"], "a": 1, "e": "Holding them the same is what lets you attribute any difference in outcome to the independent variable alone."}, {"q": "An experiment should be repeated with many trials primarily to:", "o": ["Make the hypothesis correct", "Reduce the influence of random variation and confirm the result is reproducible", "Use up materials", "Change the independent variable"], "a": 1, "e": "Larger samples let you distinguish a real effect from chance. Repetition does not correct a systematic error."}, {"q": "A researcher's data contradicts her hypothesis. The appropriate response is to:", "o": ["Discard the data and repeat until it agrees", "Report the results and revise the hypothesis or explanation", "Claim the outcome was predicted all along", "Abandon the investigation"], "a": 1, "e": "Disconfirming data is still data. Revising an explanation in light of evidence is exactly how science self-corrects."}, {"q": "In a drug trial, the group receiving an inactive pill receives a:", "o": ["Placebo", "Constant", "Catalyst", "Control variable"], "a": 0, "e": "A placebo controls for the psychological effect of being treated, isolating the drug's actual biological effect."}];
BANK[2]=[{"q": "On a standard graph, the independent variable belongs on the:", "o": ["y-axis", "x-axis", "Either axis", "Legend"], "a": 1, "e": "Convention: independent on x, dependent on y. 'DRY MIX' — Dependent, Responding, Y-axis."}, {"q": "Which graph best shows how enzyme activity changes across a continuous range of temperatures?", "o": ["Pie chart", "Bar graph", "Line graph", "Venn diagram"], "a": 2, "e": "Line graphs display continuous data and let you read trends between plotted points."}, {"q": "Which graph best compares average heights of four separate plant species?", "o": ["Line graph", "Bar graph", "Scatter plot with best-fit line", "Histogram of one species"], "a": 1, "e": "Bar graphs compare discrete categories — there is nothing meaningful 'between' two species."}, {"q": "A balance reads 2.0 g heavy on every measurement. This is:", "o": ["Random error", "Systematic error", "A controlled variable", "Acceptable data"], "a": 1, "e": "Systematic error shifts every reading the same direction. Repeating trials will not fix it — only recalibration will."}, {"q": "Ice cream sales and drowning deaths both rise in summer. The best conclusion is that:", "o": ["Ice cream causes drowning", "The two are correlated, likely because both increase with hot weather", "Drowning causes ice cream sales", "There is no relationship in the data"], "a": 1, "e": "Correlation is not causation. A third variable — summer heat — drives both."}, {"q": "A student measures 24.8 mL, 24.9 mL, and 24.7 mL. These results are:", "o": ["Precise", "Accurate but not precise", "Neither precise nor reproducible", "Systematically biased"], "a": 0, "e": "Precision is agreement among repeated measurements. Judging accuracy would require knowing the true value."}, {"q": "Data describing qualities rather than amounts is:", "o": ["Quantitative", "Qualitative", "Systematic", "Independent"], "a": 1, "e": "Qualitative data records color, texture, and behavior; quantitative data records counts and measurements."}, {"q": "Which is the best way to display what percentage of a class has each blood type?", "o": ["Line graph", "Pie chart", "Scatter plot", "Dichotomous key"], "a": 1, "e": "Pie charts show parts of a single whole, which is exactly what a percentage breakdown is."}, {"q": "A graph must include labeled axes with units because:", "o": ["It fills space", "Without the quantity and unit, the numbers cannot be interpreted", "It proves the hypothesis", "It increases sample size"], "a": 1, "e": "Unlabeled data is uninterpretable, which is why Keystone constructed-response items award credit for labeling."}, {"q": "On a graph of population over time, a line that rises steeply and then flattens indicates that:", "o": ["The population is declining", "Growth slowed as the population approached a limit", "Data collection stopped", "The y-axis was mislabeled"], "a": 1, "e": "Reading the shape of a curve — not just individual points — is the core skill Keystone data items test."}];
BANK[3]=[{"q": "The atomic number of an element equals its number of:", "o": ["Neutrons", "Protons", "Electrons plus neutrons", "Valence shells"], "a": 1, "e": "Protons define the element. Change the proton count and it becomes a different element entirely."}, {"q": "The electrons that determine how an atom bonds are the:", "o": ["Innermost electrons", "Valence electrons in the outermost shell", "Neutrons", "Protons"], "a": 1, "e": "Atoms bond in ways that fill their outer shell, so valence electron count predicts bonding behavior."}, {"q": "A covalent bond forms when atoms:", "o": ["Transfer electrons completely", "Share electrons", "Exchange protons", "Lose neutrons"], "a": 1, "e": "Covalent bonds hold together nearly every biological molecule, including the carbon backbone of macromolecules."}, {"q": "A polar covalent bond results when:", "o": ["Electrons are shared equally between identical atoms", "One atom is more electronegative and pulls the shared electrons closer", "Electrons are transferred completely", "No electrons are involved"], "a": 1, "e": "Unequal sharing creates partial charges — the reason the O–H bonds in water make the whole molecule polar."}, {"q": "A hydrogen bond differs from a covalent bond because a hydrogen bond:", "o": ["Is a strong bond within a molecule", "Is a weak attraction between molecules or between regions of one large molecule", "Transfers electrons permanently", "Joins protons directly"], "a": 1, "e": "Individually weak but collectively powerful, hydrogen bonds hold water together and hold the two strands of DNA to each other."}, {"q": "A solution differs from a pure compound because a solution is:", "o": ["Chemically bonded in fixed proportions", "A homogeneous mixture whose components are not chemically bonded", "Always a solid", "Impossible to separate"], "a": 1, "e": "Salt water is a mixture that can be separated physically; water itself is a compound that cannot."}, {"q": "Water is a polar molecule because:", "o": ["Charge is distributed equally", "Oxygen pulls the shared electrons more strongly than hydrogen, creating partial charges", "It contains three atoms", "It bonds ionically to itself"], "a": 1, "e": "Oxygen is more electronegative, so the oxygen end is partially negative and the hydrogen ends partially positive."}, {"q": "Water's high specific heat means it:", "o": ["Heats and cools rapidly", "Resists temperature change, stabilizing cells and climates", "Cannot dissolve salts", "Freezes above 0 °C"], "a": 1, "e": "Breaking hydrogen bonds absorbs large amounts of energy, so organisms and large water bodies buffer temperature swings."}, {"q": "Ice floats because:", "o": ["Ice is warmer than liquid water", "Hydrogen bonds hold molecules in an open lattice, making ice less dense than liquid water", "Ice traps air bubbles", "Water expands when it evaporates"], "a": 1, "e": "The floating ice layer insulates the water beneath, which is why lakes do not freeze solid and aquatic life survives winter."}, {"q": "A solution of pH 3 compared to a solution of pH 5 is:", "o": ["2 times more acidic", "10 times more acidic", "100 times more acidic", "100 times more basic"], "a": 2, "e": "The pH scale is logarithmic — each unit is a factor of 10, so two units is 10 × 10 = 100."}];
BANK[4]=[{"q": "Which is NOT a characteristic shared by all living organisms?", "o": ["Composed of one or more cells", "Maintains homeostasis", "Moves from place to place", "Responds to stimuli"], "a": 2, "e": "Trees and coral are alive but do not relocate. Locomotion is not a requirement for life."}, {"q": "Which structure is found in eukaryotes but NOT prokaryotes?", "o": ["Ribosomes", "A membrane-bound nucleus", "Plasma membrane", "DNA"], "a": 1, "e": "Prokaryotic DNA sits in a nucleoid region with no surrounding membrane."}, {"q": "Prokaryotic DNA is typically:", "o": ["Linear and wrapped around histone proteins", "A single circular chromosome", "Stored in mitochondria", "Absent"], "a": 1, "e": "Many prokaryotes also carry small circular plasmids that can be exchanged between cells."}, {"q": "Which is found in BOTH prokaryotic and eukaryotic cells?", "o": ["Golgi apparatus", "Ribosomes", "Endoplasmic reticulum", "Mitochondria"], "a": 1, "e": "All cells build protein, so all cells have ribosomes — prokaryotic ribosomes are simply smaller."}, {"q": "An advantage of compartmentalization in eukaryotic cells is that it:", "o": ["Reduces the DNA required", "Allows incompatible reactions to run simultaneously in separate spaces", "Eliminates the need for enzymes", "Makes cells smaller"], "a": 1, "e": "Lysosomal digestion at pH 5 would wreck the cytoplasm if it were not membrane-enclosed."}, {"q": "Which cell type divides by binary fission?", "o": ["Human skin cell", "Bacterial cell", "Plant leaf cell", "Yeast cell"], "a": 1, "e": "Binary fission is prokaryotic division — no spindle and no mitosis, just replication and splitting."}, {"q": "A virus is generally not classified as living because it:", "o": ["Contains no genetic material", "Has no cells and no metabolism, and cannot reproduce without a host", "Is too small to see", "Cannot mutate"], "a": 1, "e": "Viruses have genetic material and evolve, but they fail the cell and metabolism criteria."}, {"q": "Bacteria cause disease through several mechanisms EXCEPT:", "o": ["Multiplying rapidly and damaging tissue directly", "Releasing toxins that disrupt host cell function", "Triggering damaging inflammation", "Inserting their DNA into the host nucleus to become part of the host genome"], "a": 3, "e": "That last one describes certain viruses, not typical bacterial pathogens. Bacteria act from outside or alongside host cells, not by integrating into the host nucleus."}, {"q": "The bacterial cell wall is made largely of:", "o": ["Cellulose", "Peptidoglycan", "Chitin", "Phospholipid only"], "a": 1, "e": "Plants use cellulose, fungi use chitin, bacteria use peptidoglycan. Human cells have no wall at all — which is exactly the difference antibiotics exploit."}, {"q": "Some bacteria form a biofilm, which makes infection harder to treat because a biofilm:", "o": ["Kills the bacteria inside it", "Is a protective matrix that shields bacteria from antibiotics and immune cells", "Prevents bacteria from reproducing", "Converts bacteria to viruses"], "a": 1, "e": "Biofilms on catheters, implants, and teeth explain why some infections resist drugs that work fine on free-floating cells."}];
BANK[5]=[{"q": "The nucleolus is where:", "o": ["ATP is generated", "Ribosome subunits are assembled", "Lipids are synthesized", "Proteins are packaged for shipping"], "a": 1, "e": "The nucleolus is a dense region inside the nucleus dedicated to rRNA and ribosome assembly."}, {"q": "Rough ER is 'rough' because it is studded with:", "o": ["Lysosomes", "Ribosomes", "Vesicles", "Cilia"], "a": 1, "e": "Those ribosomes make proteins destined for secretion or for membranes, which then fold inside the ER."}, {"q": "Smooth ER is primarily responsible for:", "o": ["Protein synthesis", "Lipid synthesis and detoxification", "DNA replication", "Cellular respiration"], "a": 1, "e": "Liver cells are packed with smooth ER because they detoxify drugs and alcohol."}, {"q": "The Golgi apparatus functions to:", "o": ["Produce ATP", "Modify, sort, and package proteins for delivery", "Digest worn organelles", "Store water"], "a": 1, "e": "Proteins arrive from the ER, get tagged and modified, and leave in vesicles — the cell's shipping department."}, {"q": "Place these in the correct order for a protein the cell will secrete:", "o": ["Golgi → ribosome → rough ER → vesicle", "Ribosome on rough ER → Golgi → vesicle → plasma membrane", "Nucleus → lysosome → Golgi → ribosome", "Vesicle → Golgi → nucleus → ribosome"], "a": 1, "e": "Synthesis at the ribosome, modification in the Golgi, transport by vesicle, release by exocytosis — the pathway BIO.A.4.1.3 asks you to trace."}, {"q": "Lysosomes contain:", "o": ["Chlorophyll", "Hydrolytic digestive enzymes", "Ribosomal RNA only", "Stored starch"], "a": 1, "e": "They digest food particles, worn organelles, and invading bacteria."}, {"q": "A cell that secretes large amounts of protein hormone would have especially abundant:", "o": ["Smooth ER and lysosomes", "Rough ER and Golgi", "Chloroplasts", "Central vacuoles"], "a": 1, "e": "Structure follows function: heavy protein export demands the rough ER–Golgi–vesicle pipeline."}, {"q": "The inner membrane of a mitochondrion is folded into cristae in order to:", "o": ["Store DNA", "Increase surface area for the electron transport chain", "Hold chlorophyll", "Slow ATP production"], "a": 1, "e": "More membrane area means more room for the protein complexes that generate most of the cell's ATP."}, {"q": "Which evidence supports endosymbiotic theory?", "o": ["Mitochondria have their own circular DNA, their own ribosomes, and a double membrane", "Mitochondria occur only in animals", "Chloroplasts are built by the Golgi", "Both organelles lack membranes"], "a": 0, "e": "They also divide by a fission-like process — exactly what you would expect of engulfed ancient prokaryotes."}, {"q": "Which structure gives a plant cell its rigid shape and is absent from animal cells?", "o": ["Plasma membrane", "Cellulose cell wall", "Mitochondrion", "Ribosome"], "a": 1, "e": "The wall lies outside the membrane and is rigid; the membrane itself is flexible. Plant cells also add chloroplasts and a large central vacuole."}];
BANK[6]=[{"q": "The fluid mosaic model describes the membrane as:", "o": ["A rigid protein sheet", "A flexible phospholipid bilayer with embedded, drifting proteins", "A solid layer of cholesterol", "A single layer of lipids"], "a": 1, "e": "'Fluid' because components move laterally; 'mosaic' because of the varied proteins scattered throughout."}, {"q": "Which molecule crosses the bilayer most easily without assistance?", "o": ["Sodium ion (Na⁺)", "Glucose", "Oxygen (O₂)", "A protein"], "a": 2, "e": "Small nonpolar molecules such as O₂ and CO₂ dissolve through the lipid core; ions and large polar molecules cannot."}, {"q": "Cholesterol in an animal cell membrane:", "o": ["Transports glucose", "Buffers fluidity, keeping the membrane from becoming too fluid when warm or too rigid when cold", "Provides energy", "Forms the cell wall"], "a": 1, "e": "It wedges between phospholipids and moderates their packing across a temperature range."}, {"q": "Selective permeability means the membrane:", "o": ["Blocks everything", "Permits everything through freely", "Allows some substances to pass while restricting others", "Permits only water"], "a": 2, "e": "That selectivity is what maintains an internal environment distinct from the cell's surroundings."}, {"q": "Osmosis specifically refers to the diffusion of:", "o": ["Glucose", "Water across a selectively permeable membrane", "Oxygen", "Sodium ions"], "a": 1, "e": "Water moves toward the side with higher solute concentration, that is, lower water concentration."}, {"q": "An animal cell placed in a hypertonic solution will:", "o": ["Swell and burst", "Shrink as water leaves", "Remain unchanged", "Gain solute rapidly"], "a": 1, "e": "Hypertonic means more solute outside, so water exits. In a plant cell this pulls the membrane off the wall — plasmolysis."}, {"q": "A plant cell in a hypotonic solution becomes:", "o": ["Plasmolyzed and wilted", "Turgid and firm", "Lysed and destroyed", "Isotonic"], "a": 1, "e": "The cell wall withstands the pressure, so the cell becomes turgid — the healthy state for a plant."}, {"q": "Facilitated diffusion differs from simple diffusion in that it:", "o": ["Requires ATP", "Uses a membrane transport protein but still follows the concentration gradient", "Moves substances against the gradient", "Moves only water"], "a": 1, "e": "Still passive — the protein provides a path, not a push. Glucose transporters work this way."}, {"q": "Active transport differs from passive transport because it:", "o": ["Moves substances down the gradient", "Requires energy to move substances against the concentration gradient", "Uses no proteins", "Moves only water"], "a": 1, "e": "Passive transport runs downhill for free; active transport pumps uphill and costs ATP."}, {"q": "The sodium-potassium pump moves:", "o": ["3 Na⁺ in and 2 K⁺ out", "3 Na⁺ out and 2 K⁺ in", "2 Na⁺ out and 3 K⁺ in", "Equal amounts of both in the same direction"], "a": 1, "e": "The unequal exchange leaves the cell interior negative — essential for nerve impulse transmission."}];
BANK[7]=[{"q": "An enzyme speeds a reaction by:", "o": ["Raising the temperature", "Lowering the activation energy", "Adding energy to the products", "Changing the reaction's products"], "a": 1, "e": "Activation energy is the barrier to starting a reaction; enzymes lower that barrier without changing the products."}, {"q": "The substance an enzyme acts on is the:", "o": ["Product", "Substrate", "Coenzyme", "Inhibitor"], "a": 1, "e": "The substrate binds the active site; the product is what leaves after the reaction."}, {"q": "The induced fit model states that:", "o": ["Substrate and active site are rigid and perfectly matched", "The active site adjusts its shape slightly to grip the substrate", "Any substrate fits any enzyme", "Enzymes are consumed as they work"], "a": 1, "e": "Induced fit replaced the older rigid lock-and-key picture — the enzyme flexes around the substrate."}, {"q": "Enzymes are specific because:", "o": ["They occur only in certain organs", "The active site's shape and chemistry complement only certain substrates", "They work only at 37 °C", "They contain unique elements"], "a": 1, "e": "Lactase acts on lactose and nothing else — specificity comes from complementary shape and charge."}, {"q": "Raising temperature well above an enzyme's optimum causes reaction rate to:", "o": ["Continue rising indefinitely", "Drop sharply as the enzyme denatures", "Remain constant", "Reverse direction"], "a": 1, "e": "Heat breaks the weak bonds holding the fold, the active site loses shape, and the substrate no longer binds."}, {"q": "Denaturation means an enzyme has:", "o": ["Been used up in the reaction", "Lost its three-dimensional shape and therefore its function", "Doubled its activity", "Been converted to a carbohydrate"], "a": 1, "e": "The amino acid sequence remains intact — only the folding is destroyed, and usually irreversibly."}, {"q": "A competitive inhibitor:", "o": ["Binds the active site and blocks the substrate", "Binds a site away from the active site", "Raises activation energy directly", "Permanently denatures the enzyme"], "a": 0, "e": "It resembles the substrate and competes for the same site, so adding more substrate can outcompete it."}, {"q": "Penicillin works by blocking the enzyme that cross-links peptidoglycan. This harms bacteria but not human cells because human cells:", "o": ["Have a thicker cell wall", "Have no cell wall and no such enzyme to inhibit", "Destroy penicillin instantly", "Are too large to be affected"], "a": 1, "e": "This is selective toxicity — the drug targets a structure the pathogen has and the host does not."}, {"q": "An antibiotic that blocks an enzyme's active site by resembling its normal substrate is acting as a:", "o": ["Competitive inhibitor", "Noncompetitive inhibitor", "Cofactor", "Catalyst"], "a": 0, "e": "Sulfa drugs work this way, mimicking a substrate in the bacterial folate pathway that humans don't run."}, {"q": "Some bacteria resist penicillin by producing beta-lactamase, an enzyme that breaks the drug down. This is an example of:", "o": ["The drug becoming more effective", "An enzyme-based resistance mechanism destroying the antibiotic before it acts", "The bacterium becoming eukaryotic", "A change in the human immune system"], "a": 1, "e": "Enzyme specificity cuts both ways: the same principle that lets a drug target one enzyme lets bacteria evolve an enzyme that targets the drug."}];
BANK[8]=[{"q": "Homeostasis is best defined as:", "o": ["A complete absence of internal change", "Maintaining a relatively stable internal environment despite external change", "The sum of all chemical reactions", "Growth of an organism over time"], "a": 1, "e": "It is dynamic, not static — conditions fluctuate within a narrow acceptable range."}, {"q": "In negative feedback, the response to a change:", "o": ["Amplifies the original change", "Reverses or counteracts the original change", "Has no effect", "Permanently resets the set point"], "a": 1, "e": "Negative feedback is the dominant mode of homeostatic control — a thermostat is the standard analogy."}, {"q": "Shivering when body temperature drops is an example of:", "o": ["Positive feedback", "Negative feedback restoring the set point", "A failure of homeostasis", "Active transport"], "a": 1, "e": "Muscle contraction generates heat, opposing the drop. Sweating opposes a rise the same way."}, {"q": "Which is an example of positive feedback?", "o": ["Sweating to lower body temperature", "Insulin lowering blood glucose", "Uterine contractions during childbirth intensifying until delivery", "Kidneys conserving water when dehydrated"], "a": 2, "e": "Positive feedback amplifies a change toward a defined endpoint. Blood clotting works the same way."}, {"q": "The four components of a feedback loop are:", "o": ["Stimulus, receptor, control center, effector", "Producer, consumer, decomposer, detritivore", "Substrate, enzyme, product, inhibitor", "Gene, mRNA, ribosome, protein"], "a": 0, "e": "A stimulus is detected by a receptor, evaluated by a control center, and acted on by an effector that produces the response."}, {"q": "When you become dehydrated, your kidneys respond by:", "o": ["Producing large volumes of dilute urine", "Reabsorbing more water, producing less and more concentrated urine", "Stopping filtration entirely", "Releasing salt into the blood"], "a": 1, "e": "Water regulation is one of the three homeostasis examples the Keystone eligible content names."}, {"q": "Fever contributes to fighting infection because a raised body temperature:", "o": ["Has no effect on pathogens", "Slows the growth of many pathogens and speeds immune cell activity", "Denatures all human enzymes", "Prevents white blood cells from working"], "a": 1, "e": "It is a regulated change in the homeostatic set point, not a failure of homeostasis — though a very high fever becomes dangerous."}, {"q": "Innate immune defenses differ from adaptive immunity because innate defenses:", "o": ["Take weeks to develop", "Respond immediately and the same way to any pathogen", "Produce specific antibodies", "Only work the second time"], "a": 1, "e": "Skin, mucus, inflammation, fever, and phagocytes act at once; adaptive immunity is slower but specific."}, {"q": "A white blood cell engulfing and digesting a bacterium is carrying out:", "o": ["Exocytosis", "Phagocytosis, using lysosomal enzymes to destroy it", "Osmosis", "Photosynthesis"], "a": 1, "e": "This connects the immune response directly back to the organelle that does the digesting."}, {"q": "Vaccines work by:", "o": ["Killing bacteria already present", "Exposing the immune system to a harmless form of an antigen so memory cells form before real exposure", "Providing antibiotics in advance", "Raising body temperature permanently"], "a": 1, "e": "The memory response is what makes the second encounter faster and stronger than the first."}];
BANK[9]=[{"q": "Antibiotic resistance spreads through a bacterial population because antibiotics:", "o": ["Cause bacteria to mutate into resistant forms", "Select for resistant variants that already existed, which then reproduce", "Weaken all bacteria equally", "Are used as a nutrient by bacteria"], "a": 1, "e": "This is the single most important idea in the unit. The mutation arises randomly and beforehand; the antibiotic is the filter, not the cause."}, {"q": "Bacteria evolve resistance far faster than large animals evolve traits mainly because bacteria have:", "o": ["Larger genomes", "Very short generation times and enormous population sizes", "No DNA", "Sexual reproduction with meiosis"], "a": 1, "e": "A population can turn over a generation in twenty minutes, so selection that would take a mammal millennia plays out in days."}, {"q": "Horizontal gene transfer accelerates resistance because it lets bacteria:", "o": ["Pass resistance genes only to their own offspring", "Acquire resistance genes from other bacteria, including other species, via plasmids", "Reverse a mutation", "Become eukaryotic"], "a": 1, "e": "A plasmid carrying a resistance gene can move sideways across a population — and even between species — rather than only downward through descent."}, {"q": "Stopping an antibiotic course early can promote resistance because:", "o": ["The remaining drug becomes toxic", "The most susceptible bacteria die first, leaving the hardier survivors to repopulate", "Bacteria absorb the leftover pills", "The immune system shuts down"], "a": 1, "e": "Finishing the prescribed course is about eliminating the survivors before they rebuild the population."}, {"q": "Which is the best evidence that resistance mutations exist before exposure to the antibiotic?", "o": ["Resistant colonies appear only after long exposure", "Replica-plating experiments find resistant colonies in cultures that were never exposed to the drug", "Resistance disappears when the drug is removed", "All bacteria become resistant at once"], "a": 1, "e": "The Lederbergs' replica plating is the classic demonstration that selection acts on pre-existing variation."}, {"q": "Antibiotics are ineffective against viral infections such as the common cold because viruses:", "o": ["Are too large", "Lack the bacterial structures and enzymes antibiotics target", "Reproduce too slowly", "Have thicker cell walls"], "a": 1, "e": "No peptidoglycan wall, no bacterial ribosome, no target. Prescribing them anyway exposes the body's normal bacteria to needless selection."}, {"q": "Widespread antibiotic use in livestock contributes to human resistance problems because:", "o": ["Animals transmit antibiotics directly to people", "Resistant bacteria selected in animals can reach humans through food, water, and the environment", "Livestock antibiotics are chemically different", "Animals cannot carry bacteria"], "a": 1, "e": "Resistance genes do not respect the boundary between agricultural and clinical settings."}, {"q": "A bacterium acquires a mutation that pumps the antibiotic back out of the cell. In an environment with no antibiotic, this trait is likely to:", "o": ["Continue increasing in frequency", "Carry a metabolic cost and may decline relative to non-resistant cells", "Become instantly fatal", "Convert into a different mutation"], "a": 1, "e": "Resistance is not free. Fitness is relative to environment — the same allele is favored with the drug present and often disfavored without it."}, {"q": "MRSA is difficult to treat because it is resistant to:", "o": ["All possible antibiotics permanently", "Methicillin and related beta-lactam antibiotics, narrowing treatment options", "Only antiviral drugs", "Heat and disinfectants only"], "a": 1, "e": "Resistance is specific to drug classes. Narrowing options is what makes an infection dangerous, not total invulnerability."}, {"q": "Which practice would most slow the development of new resistance?", "o": ["Prescribing broad-spectrum antibiotics for every infection", "Prescribing antibiotics only for confirmed bacterial infections and completing the full course", "Using antibiotics preventively in healthy people", "Switching drugs daily during treatment"], "a": 1, "e": "Reducing unnecessary exposure reduces the selective pressure — the only lever that acts on the cause rather than the symptom."}];
BANK[11]=[{"q": "Carbon is uniquely suited to building biological macromolecules because each carbon atom can:", "o": ["Form one bond", "Form four covalent bonds, allowing chains, branches, and rings", "Only bond with hydrogen", "Transfer electrons to form ions"], "a": 1, "e": "Four bonding sites produce a structural variety no other element matches — the basis of all organic chemistry."}, {"q": "Dehydration synthesis joins two monomers and:", "o": ["Consumes a water molecule", "Releases a water molecule", "Releases carbon dioxide", "Requires no enzyme"], "a": 1, "e": "An –OH from one monomer and an –H from the other leave together as H₂O as the covalent bond forms."}, {"q": "Hydrolysis breaks a polymer by:", "o": ["Removing water", "Adding a water molecule across the bond", "Adding heat alone", "Adding another monomer"], "a": 1, "e": "'Hydro' = water, 'lysis' = split. Digestion in your gut is hydrolysis."}, {"q": "Digesting a starchy meal into glucose is an example of:", "o": ["Dehydration synthesis", "Hydrolysis", "Denaturation", "Photosynthesis"], "a": 1, "e": "Amylase hydrolyzes starch into monomers small enough to absorb through the intestinal wall."}, {"q": "Building a protein from amino acids in a muscle cell is an example of:", "o": ["Hydrolysis", "Dehydration synthesis", "Fermentation", "Osmosis"], "a": 1, "e": "Each peptide bond forms with the release of one water molecule."}, {"q": "Joining 5 monomers into one polymer releases how many water molecules?", "o": ["3", "4", "5", "6"], "a": 1, "e": "n monomers require n−1 bonds, so 5 monomers means 4 bonds and 4 water molecules."}, {"q": "Which monomer-to-polymer pairing is correct?", "o": ["Glucose → protein", "Amino acid → starch", "Nucleotide → nucleic acid", "Fatty acid → cellulose"], "a": 2, "e": "Nucleotides polymerize into DNA and RNA; amino acids make proteins; glucose makes starch, glycogen, and cellulose."}, {"q": "Which macromolecule class is NOT assembled from a long chain of one repeating monomer?", "o": ["Protein", "Nucleic acid", "Polysaccharide", "Lipid"], "a": 3, "e": "Lipids assemble from glycerol plus fatty acids rather than a repeating unit, so they are not true polymers."}, {"q": "Both dehydration synthesis and hydrolysis in living cells are:", "o": ["Spontaneous and instantaneous", "Catalyzed by specific enzymes", "Impossible without sunlight", "The same reaction"], "a": 1, "e": "Uncatalyzed, these reactions are far too slow to sustain life."}, {"q": "Organic compounds are distinguished from inorganic compounds primarily by containing:", "o": ["Oxygen", "Carbon bonded to hydrogen", "Water", "Nitrogen"], "a": 1, "e": "Carbon dioxide contains carbon but no C–H bonds, which is why it is classified as inorganic."}];
BANK[12]=[{"q": "The monomer of a carbohydrate is a:", "o": ["Amino acid", "Monosaccharide", "Nucleotide", "Fatty acid"], "a": 1, "e": "Glucose is the standard example. Two make a disaccharide; many make a polysaccharide such as starch, glycogen, or cellulose."}, {"q": "Lipids are hydrophobic because they consist largely of:", "o": ["Nonpolar hydrocarbon chains", "Positively charged groups", "Amino acids", "Small ionic molecules"], "a": 0, "e": "Nonpolar molecules cannot hydrogen-bond with water — which is also why lipids must be carried through the bloodstream by protein packages."}, {"q": "A saturated fatty acid:", "o": ["Has double bonds and is liquid at room temperature", "Has no carbon–carbon double bonds, is straight, and packs into a solid at room temperature", "Contains nitrogen", "Is the monomer of protein"], "a": 1, "e": "'Saturated' means saturated with hydrogen. Straight chains pack tightly, which is why butter is solid and olive oil is not."}, {"q": "Gram for gram, lipids store more energy than carbohydrates because lipids contain more:", "o": ["Oxygen atoms", "Carbon–hydrogen bonds", "Water", "Glucose units"], "a": 1, "e": "Energy is held in C–H bonds, and lipids are far richer in them — roughly twice the energy per gram."}, {"q": "Cholesterol is best described as:", "o": ["A toxin with no function in the body", "A steroid lipid the body requires for membranes and for making certain hormones", "A type of protein", "A simple carbohydrate"], "a": 1, "e": "Your liver manufactures it because you need it. The health question is not whether you have cholesterol but how it is transported and where it ends up."}, {"q": "LDL is often called 'bad' cholesterol because LDL particles:", "o": ["Contain no cholesterol", "Deliver cholesterol to tissues and can deposit it in artery walls", "Remove cholesterol from arteries", "Are made of protein only"], "a": 1, "e": "LDL and HDL are not different cholesterol molecules — they are different lipoprotein carriers moving the same molecule in opposite directions."}, {"q": "HDL is considered protective because it:", "o": ["Blocks all fat absorption", "Transports excess cholesterol from tissues back to the liver for removal", "Converts cholesterol into protein", "Prevents the liver from functioning"], "a": 1, "e": "Reverse cholesterol transport is why the LDL-to-HDL relationship matters more than a single total number."}, {"q": "Atherosclerosis is the process in which:", "o": ["Arteries widen permanently", "Plaque containing cholesterol and other material builds up in artery walls, narrowing them", "Blood loses all its lipids", "The heart stops producing enzymes"], "a": 1, "e": "A narrowed or ruptured plaque restricts or blocks blood flow, which is the mechanism behind most heart attacks and many strokes."}, {"q": "Which dietary change is most strongly associated with raising LDL levels?", "o": ["Replacing saturated and trans fats with unsaturated fats", "Increasing intake of saturated and trans fats", "Increasing dietary fiber", "Increasing intake of leafy vegetables"], "a": 1, "e": "Trans fats are the worst case — they raise LDL and lower HDL simultaneously, which is why they were largely removed from the food supply."}, {"q": "A person eats very little cholesterol but still has high blood cholesterol. The most likely explanation is that:", "o": ["The test is always wrong", "The liver synthesizes cholesterol, and genetics strongly influences how much and how it is cleared", "Cholesterol comes only from food", "They must be eating cholesterol secretly"], "a": 1, "e": "Most circulating cholesterol is made internally, not eaten. This is exactly why the question of genetic risk comes next in the unit."}];
BANK[13]=[{"q": "The monomer of a protein is an:", "o": ["Amino acid", "Monosaccharide", "Nucleotide", "Isotope"], "a": 0, "e": "Twenty amino acids exist; each has an amino group, a carboxyl group, and a variable R group."}, {"q": "What distinguishes one amino acid from another?", "o": ["The amino group", "The carboxyl group", "The R group (side chain)", "The central carbon"], "a": 2, "e": "All twenty share the same backbone. The R group determines charge, polarity, and how the chain folds."}, {"q": "The bond joining two amino acids is a:", "o": ["Hydrogen bond", "Peptide bond", "Ionic bond", "Glycosidic bond"], "a": 1, "e": "A peptide bond forms by dehydration synthesis between the carboxyl of one amino acid and the amino group of the next."}, {"q": "A protein's function is determined most directly by its:", "o": ["Total number of amino acids", "Three-dimensional folded shape", "Color", "Location in the cell"], "a": 1, "e": "Structure determines function. Denature the shape and the protein stops working even though every amino acid is still present."}, {"q": "Which is NOT a typical protein function?", "o": ["Catalyzing reactions as enzymes", "Transporting oxygen as hemoglobin", "Serving as the primary long-term energy store", "Forming structures such as keratin and collagen"], "a": 2, "e": "Proteins can be burned for energy but are not the primary store — that role belongs to lipids and carbohydrates."}, {"q": "A nucleotide consists of:", "o": ["A sugar, a phosphate group, and a nitrogen base", "Glycerol and three fatty acids", "An amino group and an R group", "Two monosaccharides"], "a": 0, "e": "Those three parts repeat down the backbone; only the base changes from one nucleotide to the next."}, {"q": "Which sugar is found in RNA?", "o": ["Deoxyribose", "Ribose", "Glucose", "Sucrose"], "a": 1, "e": "RNA contains ribose, which has one more oxygen than the deoxyribose in DNA — the source of both names."}, {"q": "Which nitrogen base appears in RNA but not DNA?", "o": ["Thymine", "Uracil", "Cytosine", "Guanine"], "a": 1, "e": "RNA substitutes uracil for thymine; adenine, cytosine, and guanine appear in both."}, {"q": "The primary role of DNA is to:", "o": ["Catalyze metabolic reactions", "Store the hereditary instructions for building proteins", "Transport substances across membranes", "Store long-term energy"], "a": 1, "e": "DNA is the archive; RNA carries the working copy out to the ribosome."}, {"q": "Which pairing correctly matches a macromolecule to an element that distinguishes it?", "o": ["Carbohydrate — nitrogen", "Lipid — phosphorus in every type", "Protein — nitrogen and often sulfur", "Nucleic acid — sulfur"], "a": 2, "e": "Proteins always contain nitrogen and often sulfur; nucleic acids contain nitrogen and phosphorus; carbohydrates and most lipids are just C, H, O."}];
BANK[14]=[{"q": "In DNA, adenine pairs with:", "o": ["Guanine", "Cytosine", "Thymine", "Uracil"], "a": 2, "e": "A–T held by two hydrogen bonds, C–G by three. Chargaff's rule follows directly from this pairing."}, {"q": "The two strands of the double helix are held to each other by:", "o": ["Covalent bonds between bases", "Hydrogen bonds between complementary bases", "Ionic bonds", "Peptide bonds"], "a": 1, "e": "Individually weak hydrogen bonds let the strands be unzipped for replication, yet collectively hold the helix together."}, {"q": "If a DNA sample is 30% adenine, what percentage is guanine?", "o": ["30%", "20%", "40%", "70%"], "a": 1, "e": "A=30 means T=30, so C+G = 40, split evenly: G = 20%."}, {"q": "The sugar-phosphate backbone running along each strand is held together by:", "o": ["Hydrogen bonds", "Covalent bonds", "Ionic bonds", "Peptide bonds"], "a": 1, "e": "Strong covalent bonds run lengthwise; weaker hydrogen bonds hold the two strands across the middle."}, {"q": "'Antiparallel' means the two DNA strands:", "o": ["Have identical sequences", "Run in opposite 5'→3' directions", "Never separate", "Are made of RNA"], "a": 1, "e": "This orientation is why DNA polymerase, which only builds 5'→3', handles the two strands differently."}, {"q": "DNA replication is semiconservative, meaning each new molecule contains:", "o": ["Two brand-new strands", "One original strand and one newly built strand", "Only original strands", "One DNA and one RNA strand"], "a": 1, "e": "Keeping one original strand in each copy is how the genetic code is conserved across generations of cells."}, {"q": "Helicase functions to:", "o": ["Add nucleotides", "Unwind and separate the double helix at the replication fork", "Seal fragments together", "Proofread base pairs"], "a": 1, "e": "It breaks the hydrogen bonds between base pairs so each strand can serve as a template."}, {"q": "DNA polymerase adds nucleotides and also:", "o": ["Unzips the helix", "Proofreads for mismatched bases", "Transcribes RNA", "Assembles ribosomes"], "a": 1, "e": "Proofreading drops the error rate to roughly one mistake per billion bases."}, {"q": "DNA ligase is responsible for:", "o": ["Joining fragments by sealing the sugar-phosphate backbone", "Unwinding DNA", "Reading codons", "Producing tRNA"], "a": 0, "e": "It is also essential in genetic engineering, where it joins a cut gene into a plasmid."}, {"q": "The complementary DNA strand for 5'-ATGCCG-3' is:", "o": ["3'-TACGGC-5'", "3'-ATGCCG-5'", "3'-UACGGC-5'", "5'-TACGGC-3'"], "a": 0, "e": "Pair each base and note the strands run antiparallel; uracil would only appear if this were RNA."}];
BANK[15]=[{"q": "Transcription produces:", "o": ["DNA from DNA", "mRNA from a DNA template", "Protein from mRNA", "tRNA from protein"], "a": 1, "e": "RNA polymerase reads the DNA template and builds a complementary mRNA strand in the nucleus."}, {"q": "Translation occurs at the:", "o": ["Nucleus", "Ribosome", "Golgi apparatus", "Mitochondrion only"], "a": 1, "e": "The ribosome reads codons and links the amino acids that tRNA delivers."}, {"q": "A codon consists of:", "o": ["One nucleotide", "Two nucleotides", "Three nucleotides", "Three amino acids"], "a": 2, "e": "Three bases specify one amino acid; 4³ = 64 possible codons cover 20 amino acids plus stop signals."}, {"q": "The mRNA transcribed from the DNA template 3'-TAC-5' is:", "o": ["5'-AUG-3'", "5'-ATG-3'", "5'-TAC-3'", "5'-UAC-3'"], "a": 0, "e": "Pair complementarily and substitute uracil for thymine. AUG is also the start codon."}, {"q": "The molecule that carries amino acids to the ribosome is:", "o": ["mRNA", "tRNA", "rRNA", "DNA polymerase"], "a": 1, "e": "Each tRNA carries a specific amino acid and has an anticodon matching the corresponding mRNA codon."}, {"q": "A stop codon causes the ribosome to:", "o": ["Add a special amino acid", "Release the finished polypeptide and end translation", "Reverse direction", "Begin transcription"], "a": 1, "e": "UAA, UAG, and UGA code for no amino acid; they signal termination."}, {"q": "The central dogma of molecular biology is:", "o": ["Protein → RNA → DNA", "DNA → RNA → protein", "RNA → DNA → protein", "DNA → protein → RNA"], "a": 1, "e": "Replication copies DNA, transcription makes RNA, translation makes protein."}, {"q": "Transcription and translation occur in essentially the same way in bacteria, plants, and humans. This supports the conclusion that:", "o": ["All organisms are the same species", "The genetic code is universal, consistent with common ancestry", "Proteins are unnecessary", "DNA differs fundamentally between kingdoms"], "a": 1, "e": "Universality is why bacteria can read an inserted human gene and produce human insulin."}, {"q": "After translation, a protein destined for secretion is processed by the:", "o": ["Nucleolus and centriole", "Rough ER and then the Golgi apparatus", "Lysosome and vacuole", "Mitochondrion and chloroplast"], "a": 1, "e": "BIO.B.2.2.2 expects you to connect protein synthesis to the organelles that modify and ship the product."}, {"q": "Which correctly distinguishes the end products of replication, transcription, and translation?", "o": ["DNA, RNA, and protein respectively", "RNA, protein, and DNA respectively", "Protein, DNA, and RNA respectively", "All three produce protein"], "a": 0, "e": "Replication copies DNA; transcription yields RNA; translation yields a polypeptide."}];
BANK[16]=[{"q": "A point mutation is a change in:", "o": ["An entire chromosome", "A single nucleotide base", "The number of chromosomes", "The ribosome"], "a": 1, "e": "Substitutions are point mutations; insertions and deletions of one base shift the reading frame instead."}, {"q": "A silent mutation is one in which:", "o": ["An entire gene is deleted", "A base changes but the amino acid specified does not", "A stop codon appears early", "The reading frame shifts"], "a": 1, "e": "The genetic code is redundant — several codons specify the same amino acid, so some substitutions have no effect."}, {"q": "A missense mutation results in:", "o": ["No change to the protein", "One amino acid being replaced by a different one", "A shortened protein ending early", "A frameshift"], "a": 1, "e": "Sickle cell anemia is the classic case: one amino acid substitution alters hemoglobin's shape."}, {"q": "A nonsense mutation results in:", "o": ["A longer protein", "A premature stop codon, producing a shortened and usually nonfunctional protein", "A silent change", "An extra chromosome"], "a": 1, "e": "Translation terminates early, so the polypeptide never folds into a working shape."}, {"q": "A frameshift mutation is caused by:", "o": ["A single base substitution", "An insertion or deletion of bases not in multiples of three", "A change in temperature", "Crossing over"], "a": 1, "e": "Every codon downstream is misread, so frameshifts are usually far more damaging than substitutions."}, {"q": "Which mutation is likely to have the most severe effect on the resulting protein?", "o": ["A silent substitution", "A single-base deletion near the start of the gene", "A substitution in the third base of a codon", "A substitution in a non-coding region"], "a": 1, "e": "An early frameshift garbles nearly the entire protein; a late one damages less."}, {"q": "A mutation can be passed to offspring only if it occurs in:", "o": ["A skin cell", "A gamete or the cells that produce gametes", "A liver cell", "A red blood cell"], "a": 1, "e": "Somatic mutations affect only the individual; sex-cell mutations enter the next generation."}, {"q": "A mutagen is:", "o": ["A protein that repairs DNA", "An agent such as UV radiation or certain chemicals that increases mutation rate", "A type of codon", "An enzyme that reads mRNA"], "a": 1, "e": "Exposure raises mutation frequency, which is why many mutagens are also carcinogens."}, {"q": "A mutation's effect on an organism's success may be:", "o": ["Always harmful", "Always beneficial", "Harmful, beneficial, or have little to no effect depending on the environment", "Impossible to determine"], "a": 2, "e": "The sickle cell allele is costly generally but protective where malaria is common — fitness is environment-relative."}, {"q": "Mutations are important to evolution because they:", "o": ["Are directed toward what the organism needs", "Are the ultimate source of new genetic variation", "Always improve fitness", "Occur only during meiosis"], "a": 1, "e": "Crossing over and independent assortment reshuffle existing alleles; only mutation creates new ones."}];
BANK[17]=[{"q": "DNA replication occurs during which stage of the cell cycle?", "o": ["G1", "S phase of interphase", "Mitosis", "Cytokinesis"], "a": 1, "e": "S stands for synthesis. G1 is growth, G2 prepares for division, and mitosis divides what S already copied."}, {"q": "Chromosomes line up along the cell's equator during:", "o": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "a": 1, "e": "Metaphase — 'M' for middle. Each chromosome attaches to spindle fibers from both poles."}, {"q": "Sister chromatids separate and move to opposite poles during:", "o": ["Prophase", "Metaphase", "Anaphase", "Cytokinesis"], "a": 2, "e": "Anaphase — 'A' for apart. This step guarantees each daughter cell receives a complete set."}, {"q": "Mitosis produces:", "o": ["Four haploid cells", "Two genetically identical diploid cells", "Two haploid gametes", "One diploid cell"], "a": 1, "e": "Mitosis serves growth, repair, and asexual reproduction — identical copies, not variation."}, {"q": "A human somatic cell has 46 chromosomes. After mitosis, each daughter cell has:", "o": ["23", "46", "92", "69"], "a": 1, "e": "Chromosome number is conserved because DNA replicated once and divided once."}, {"q": "Cytokinesis in plant cells differs from animal cells because plant cells:", "o": ["Form a cleavage furrow", "Form a cell plate that becomes a new cell wall", "Do not divide the cytoplasm", "Skip cytokinesis"], "a": 1, "e": "A rigid wall cannot pinch inward, so a new wall is built from the middle outward."}, {"q": "Cell-cycle checkpoints function to:", "o": ["Speed division along", "Verify conditions such as DNA integrity before the cycle continues", "Increase chromosome number", "Trigger fermentation"], "a": 1, "e": "Signaling molecules halt the cycle when something is wrong, allowing time for repair."}, {"q": "Cancer is best described as:", "o": ["A bacterial infection", "Uncontrolled cell division resulting from mutations in genes that regulate the cell cycle", "A failure of cytokinesis only", "An enzyme deficiency"], "a": 1, "e": "The mutations disable the brakes and jam the accelerator; a malignant tumor then metastasizes to distant tissue."}, {"q": "Cell differentiation occurs because differentiated cells:", "o": ["Contain different genes", "Express different portions of the same genome", "Have different chromosome numbers", "Underwent meiosis"], "a": 1, "e": "A nerve cell and a skin cell carry identical instruction sets; they differ in which instructions are switched on."}, {"q": "Stem cells are distinguished by their ability to:", "o": ["Divide without DNA replication", "Divide and differentiate into more than one specialized cell type", "Perform photosynthesis", "Survive without a nucleus"], "a": 1, "e": "That potential is what makes them valuable in regenerative medicine."}];
